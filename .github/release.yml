changelog:
  exclude:
    labels:
      - ignore-for-release
      - duplicate
      - question
      - invalid
    authors:
      - dependabot
      - dependabot[bot]
  categories:
    - title: ⚠️ Breaking Changes
      labels:
        - breaking
        - "breaking-change"
    - title: 🚀 Features
      labels:
        - enhancement
        - feature
    - title: 🐛 Bug Fixes
      labels:
        - bug
        - fix
    - title: 🔒 Security
      labels:
        - security
    - title: 📦 Dependencies
      labels:
        - dependencies
    - title: 📖 Documentation
      labels:
        - documentation
        - docs
    - title: 🏗 Infrastructure
      labels:
        - infrastructure
        - ci
        - build
    - title: Other Changes
      labels:
        - "*"
