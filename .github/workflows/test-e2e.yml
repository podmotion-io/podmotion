name: E2E Tests

# INTERIM DEFAULT — manual trigger only.
#
# `make test-e2e` targets the standing KVM/libvirt cluster (VMs pm-cp1/pm-w1/pm-w2 on
# a private 192.168.122.0/24 NAT network). A GitHub-hosted runner cannot reach that
# network, so on push/pull_request this workflow failed 100% of the time and reported
# a permanent false "CI is red" signal on every commit.
#
# Switching the trigger to workflow_dispatch stops the false signal; it does NOT make
# the suite runnable from a hosted runner. The real decision — self-hosted runner on
# the KVM host, an ephemeral in-CI cluster, or dropping this workflow — is still open
# and deliberately NOT made here.
on:
  workflow_dispatch:

permissions: {}

jobs:
  test-e2e:
    permissions:
      contents: read
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Install the latest version of kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/latest/kind-linux-$(go env GOARCH)
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Verify kind installation
        run: kind version

      - name: Running Test e2e
        run: |
          go mod tidy
          make test-e2e
