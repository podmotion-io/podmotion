name: Reusable Build Image

on:
  workflow_call:
    inputs:
      image:
        description: "Image short name (operator|agent|scheduler|pm-checkpoint-gc)"
        required: true
        type: string
      tags:
        description: "docker/metadata-action tags block (newline-separated)"
        required: true
        type: string
      sign:
        description: "Sign the image with cosign keyless"
        required: false
        default: true
        type: boolean
      sbom:
        description: "Generate SBOM with syft and attest"
        required: false
        default: true
        type: boolean
    outputs:
      digest:
        description: "Pushed image digest"
        value: ${{ jobs.build.outputs.digest }}
      image-ref:
        description: "Fully-qualified image ref (without tag)"
        value: ${{ jobs.build.outputs.image-ref }}

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: podmotion-io

jobs:
  build:
    name: Build ${{ inputs.image }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ inputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        if: ${{ inputs.sign }}
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ inputs.image }}
          tags: ${{ inputs.tags }}
          labels: |
            org.opencontainers.image.title=podmotion-${{ inputs.image }}
            org.opencontainers.image.description=PodMotion ${{ inputs.image }} — live pod migration for Kubernetes
            org.opencontainers.image.url=https://podmotion.io
            org.opencontainers.image.source=https://github.com/podmotion-io/podmotion
            org.opencontainers.image.licenses=Apache-2.0
          annotations: |
            org.opencontainers.image.title=podmotion-${{ inputs.image }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./cmd/${{ inputs.image }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=${{ inputs.image }}
          cache-to: type=gha,mode=max,scope=${{ inputs.image }}

      - name: Sign image (keyless)
        if: ${{ inputs.sign }}
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
          COSIGN_EXPERIMENTAL: "true"
        run: |
          images=""
          for tag in ${TAGS}; do
            images="${images} ${tag}@${DIGEST}"
          done
          cosign sign --yes ${images}

      - name: Install syft
        if: ${{ inputs.sbom }}
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - name: Generate SBOM (SPDX-JSON)
        if: ${{ inputs.sbom }}
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ inputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          syft "${IMAGE_REF}@${DIGEST}" -o spdx-json="sbom-${{ inputs.image }}.spdx.json"

      - name: Attest SBOM
        if: ${{ inputs.sbom }}
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ inputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          COSIGN_EXPERIMENTAL: "true"
        run: |
          cosign attest --yes \
            --predicate "sbom-${{ inputs.image }}.spdx.json" \
            --type spdxjson \
            "${IMAGE_REF}@${DIGEST}"

      - name: Upload SBOM artifact
        if: ${{ inputs.sbom }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ inputs.image }}
          path: sbom-${{ inputs.image }}.spdx.json
          retention-days: 30
