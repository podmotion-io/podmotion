name: Nightly

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: podmotion-io
  GO_VERSION: "1.24"

jobs:
  test:
    name: Extended Tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - name: go test -race
        run: go test -race ./...
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: govulncheck
        run: govulncheck ./...

  build:
    name: Build & Push :nightly
    needs: [test]
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        image: [operator, agent, scheduler, pm-checkpoint-gc]
    uses: ./.github/workflows/_build-image.yaml
    with:
      image: ${{ matrix.image }}
      tags: |
        type=raw,value=nightly
      sign: true
      sbom: true
    secrets: inherit

  report-failure:
    name: Open Failure Issue
    needs: [test, build]
    if: failure()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Open / update nightly failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TEST_RESULT: ${{ needs.test.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          today=$(date -u +%Y-%m-%d)
          title="Nightly build failure ${today}"
          body=$(cat <<EOF
          The nightly workflow failed.

          - **Test job:** ${TEST_RESULT}
          - **Build job:** ${BUILD_RESULT}
          - **Run:** ${RUN_URL}
          - **Commit:** ${{ github.sha }}

          This issue was opened automatically. Please investigate the failing run above.
          EOF
          )
          # Avoid duplicates for the same day.
          existing=$(gh issue list --label nightly-failure --search "${title} in:title" \
            --state open --json number --jq '.[0].number' || echo "")
          if [ -n "${existing}" ]; then
            gh issue comment "${existing}" --body "Nightly failed again. Run: ${RUN_URL}"
          else
            gh label create nightly-failure --color B60205 --description "Automated nightly failures" 2>/dev/null || true
            gh issue create --title "${title}" --label nightly-failure --body "${body}"
          fi
