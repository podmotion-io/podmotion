name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: podmotion-io

jobs:
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify CI passed on this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sha="${{ github.sha }}"
          echo "Checking CI conclusion for ${sha}"
          # FAIL-CLOSED: a release must never ship on an unverified commit. The
          # previous form (`!= success && -n "$status"`) let an EMPTY status — no CI
          # run found for this SHA, or a failed `gh` call — fall straight through to
          # "passed", which is the exact case the gate exists to catch.
          status=$(gh run list --workflow=ci.yaml --commit "${sha}" \
            --json conclusion --jq '.[0].conclusion' 2>/dev/null || echo "")
          if [ -z "${status}" ] || [ "${status}" = "null" ]; then
            echo "::error::No CI result found for ${sha}. Refusing to release an unverified commit."
            exit 1
          fi
          if [ "${status}" != "success" ]; then
            echo "::error::CI for ${sha} did not succeed (status: ${status})."
            exit 1
          fi
          echo "CI gate passed (status: ${status})."

  prepare:
    name: Prepare Tags
    needs: [ci-gate]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      tags: ${{ steps.semver.outputs.tags }}
    steps:
      - name: Compute semver tags
        id: semver
        run: |
          ref="${GITHUB_REF#refs/tags/}"      # v1.2.3
          ver="${ref#v}"                       # 1.2.3
          major="${ver%%.*}"
          minor="${ver%.*}"
          {
            echo "tags<<EOF"
            echo "type=raw,value=${ref}"
            echo "type=raw,value=v${minor}"
            echo "type=raw,value=v${major}"
            echo "type=raw,value=latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build & Sign Images
    needs: [prepare]
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        image: [operator, agent, scheduler]
    uses: ./.github/workflows/_build-image.yaml
    with:
      image: ${{ matrix.image }}
      tags: ${{ needs.prepare.outputs.tags }}
      sign: true
      sbom: true
    secrets: inherit

  provenance:
    name: SLSA Provenance
    needs: [build]
    permissions:
      actions: read
      id-token: write
      packages: write
    strategy:
      matrix:
        image: [operator, agent, scheduler]
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0
    with:
      image: ghcr.io/podmotion-io/${{ matrix.image }}
      digest: ${{ needs.build.outputs.digest }}
      registry-username: ${{ github.actor }}
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}

  installer:
    name: Build Installer Manifest
    needs: [build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Build installer
        env:
          IMG: ghcr.io/podmotion-io/operator:${{ github.ref_name }}
        run: make build-installer
      - name: Upload installer artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: install-manifest
          path: dist/install.yaml
          retention-days: 90

  helm:
    name: Package & Push Helm Chart
    needs: [build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.16.3
      - name: Log in to GHCR (Helm)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login ${{ env.REGISTRY }} \
            --username ${{ github.actor }} --password-stdin
      - name: Package chart
        run: |
          ver="${GITHUB_REF_NAME#v}"
          helm package charts/podmotion --version "${ver}" --app-version "${ver}"
      - name: Push chart to OCI registry
        run: |
          ver="${GITHUB_REF_NAME#v}"
          helm push "podmotion-${ver}.tgz" "oci://${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/charts"

  github-release:
    name: Create GitHub Release
    needs: [build, installer, helm]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download installer artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: install-manifest
          path: dist
      - name: Download SBOMs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: sbom-*
          path: sboms
          merge-multiple: true
      - name: Write release notes header
        env:
          TAG: ${{ github.ref_name }}
        run: |
          cat > release-header.md <<EOF
          ## PodMotion ${TAG}

          Live pod migration for Kubernetes.

          ### Install

          \`\`\`bash
          kubectl apply -f https://github.com/podmotion-io/podmotion/releases/download/${TAG}/install.yaml
          \`\`\`

          Or via Helm:

          \`\`\`bash
          helm install podmotion oci://ghcr.io/podmotion-io/charts/podmotion --version ${TAG#v}
          \`\`\`

          ### Images

          - \`ghcr.io/podmotion-io/operator:${TAG}\`
          - \`ghcr.io/podmotion-io/agent:${TAG}\`
          - \`ghcr.io/podmotion-io/scheduler:${TAG}\`

          All images are multi-arch (amd64/arm64), cosign-signed (keyless), and ship SPDX SBOM attestations with SLSA L2 provenance.

          ---
          EOF
      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "${TAG}" \
            --title "PodMotion ${TAG}" \
            --notes-file release-header.md \
            --generate-notes \
            --verify-tag \
            dist/install.yaml \
            sboms/*.spdx.json
