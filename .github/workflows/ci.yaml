name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Go toolchain is read from go.mod (go-version-file) so it can never drift from
  # the module's own `go` directive. Matches lint.yml / test.yml / test-e2e.yml.
  # golangci-lint must match the Makefile pin (GOLANGCI_LINT_VERSION) — .golangci.yml
  # is a v2-schema config and a v1.x binary cannot parse it.
  GOLANGCI_LINT_VERSION: "v2.11.4"
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: podmotion-io

jobs:
  test:
    name: Unit Tests (race)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Download modules
        run: go mod download
      # The controller suite (internal/controller/suite_test.go BeforeSuite) starts a
      # real Kubernetes control plane via envtest, which needs the etcd/kube-apiserver
      # test binaries on disk and KUBEBUILDER_ASSETS pointing at them. Without this the
      # job fails before any assertion runs. Uses the same setup-envtest mechanism as
      # the Makefile `test` target.
      - name: Set up envtest control-plane binaries
        run: make setup-envtest
      - name: Run tests with race detector
        run: |
          KUBEBUILDER_ASSETS="$(make --no-print-directory envtest-path)"
          export KUBEBUILDER_ASSETS
          echo "KUBEBUILDER_ASSETS=${KUBEBUILDER_ASSETS}"
          # /e2e is excluded: it targets a standing external cluster a hosted runner
          # cannot reach (same reason test-e2e.yml is workflow_dispatch-only).
          go test -race -coverprofile=coverage.out -covermode=atomic $(go list ./... | grep -v /e2e)
      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  lint:
    name: golangci-lint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --timeout=10m

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        run: govulncheck ./...

  codegen-check:
    name: CRD / Codegen Drift Check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Generate manifests and code
        run: make manifests generate
      - name: Verify no drift
        run: |
          if ! git diff --exit-code; then
            echo "::error::Generated files are out of date. Run 'make manifests generate' and commit the result."
            exit 1
          fi

  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.16.3
      - name: Helm lint
        run: helm lint charts/podmotion

  substrate-version-check:
    name: Substrate K8s Version Cross-Check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check go.mod k8s.io/kubernetes floor against every deploy substrate
        run: bash hack/check-substrate-k8s-versions.sh

  build-validate:
    name: Multi-Arch Build Validation
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
        # Package paths and build tags are explicit because they are NOT uniform:
        #  - the operator entrypoint is cmd/main.go (package ./cmd), not ./cmd/operator
        #  - cmd/scheduler is behind the `scheduler` build tag (ADR-0363), so without
        #    -tags scheduler the compiler reports "build constraints exclude all Go files"
        # These three are exactly the components with a shipping images/<name>/Dockerfile.
        component:
          - name: operator
            pkg: ./cmd
            tags: ""
          - name: agent
            pkg: ./cmd/agent
            tags: ""
          - name: scheduler
            pkg: ./cmd/scheduler
            tags: "scheduler"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Compile ${{ matrix.component.name }} for linux/${{ matrix.goarch }}
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -trimpath \
            -tags "${{ matrix.component.tags }}" \
            -o "/tmp/${{ matrix.component.name }}-${{ matrix.goarch }}" \
            "${{ matrix.component.pkg }}"

  push-main:
    name: Build & Push (main)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, lint, govulncheck, codegen-check, helm-lint, build-validate]
    # NOTE: a job that calls a reusable workflow via `uses:` must NOT declare
    # `runs-on:` — the runner is chosen by the called workflow. Declaring both is
    # a schema error that makes GitHub reject this entire file at parse time (so
    # no job in it runs at all). Do not re-add runs-on here.
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        image: [operator, agent, scheduler]
    uses: ./.github/workflows/_build-image.yaml
    with:
      image: ${{ matrix.image }}
      tags: |
        type=raw,value=latest
        type=sha,prefix=sha-,format=short
      sign: true
      sbom: true
    secrets: inherit
