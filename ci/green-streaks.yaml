# ci/green-streaks.yaml — per-cell consecutive green run counters
# Written by the CI aggregation job after each run.
# Read by scripts/check-release-gate.sh to enforce the 10-consecutive-green-run gate.
# All cells start as data-pending (no runs recorded yet).
# Per ADR-0093 §3.2 and bootstrap gap policy in internal/ci/flakedb.go.
#
# Status values:
#   data-pending  — fewer than 10 recorded runs; blocks ReadyForPromotion
#   active        — at least one run recorded; current_streak may be < 10
#
# schema_version: 1

schema_version: 1

streaks:
