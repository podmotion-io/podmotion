# PodMotion Helm chart values

operator:
  image:
    repository: ghcr.io/podmotion/podmotion-operator
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 3
  # ADR-0401 (review condition C3): PodDisruptionBudget for the operator. With the eviction webhook
  # failurePolicy: Fail, cluster-wide user-namespace API-eviction availability depends on the
  # webhook (operator) being reachable; all replicas serve the webhook. A minAvailable:1 PDB
  # prevents a voluntary disruption (node drain / autoscaler consolidation) from taking every
  # webhook backend down at once. Rendered only when replicas > 1 (a no-op at replicas:1 dev by
  # design — see templates/operator-pdb.yaml). Default true.
  podDisruptionBudget:
    enabled: true
  # featureGates enables experimental feature gates in the operator.
  # Passed as --feature-gates=<value> to the manager binary.
  # Example: "TCPPreservation=true,GPUMigration=false"
  featureGates: "TCPPreservation=true"
  # longhornManagerURL is the base URL of the Longhorn Manager HTTP API, used by the
  # Tier1 storage migrator for dual-engine live migration (replica add/poll/detach/attach).
  # Passed as --longhorn-manager-url=<value> to the manager binary. Defaults to the
  # standard in-cluster Longhorn service address; override for non-standard installs.
  longhornManagerURL: "http://longhorn-backend.longhorn-system.svc.cluster.local:9500"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # ADR-SEC-A §2.1 / ADR-SEC-B §2.1: operator mTLS client cert (also the checkpoint signing key).
  # The operator fails closed without it. Default true (fail-closed).
  tls:
    agentClient:
      enabled: true
      secretName: podmotion-operator-agent-client-tls

agent:
  image:
    repository: ghcr.io/podmotion/podmotion-agent
    tag: latest
    pullPolicy: IfNotPresent
  grpcPort: 9090
  metricsPort: 9091
  # ADR-0148 D2: gate CAP_BPF/CAP_PERFMON behind kernel >= 5.8. On kernels < 5.8 these
  # capability names do not exist and the kubelet/runtime rejects them; set false on such
  # nodes and BPF/perf rights fall back to CAP_SYS_ADMIN (as they always did pre-5.8).
  kernelGE58: true
  # sprint50 (k3s compat): standard kubeadm/containerd host paths. These drive ONLY the
  # DaemonSet's static hostPath VOLUME MOUNTS (containerd-socket, host-var-lib-containerd —
  # charts/podmotion/templates/daemonset.yaml) and must always be a concrete, non-empty path
  # (a Helm-render-time value; Kubernetes rejects an empty hostPath). They are NOT the agent's
  # own idea of which containerd is authoritative — see containerd.override below (ADR-0370).
  containerd:
    socketPath: /run/containerd/containerd.sock
    stateDir: /var/lib/containerd
    # ADR-0370: explicit operator override for the agent's OWN self-discovery primitive
    # (internal/agent/server/containerd_discovery.go). Deliberately a SEPARATE set of fields
    # from socketPath/stateDir above — those always render a concrete value (required for the
    # volume mounts), so tying the override signal to them would mean every deploy looks like
    # an explicit override and self-discovery could never run. Leave all three empty (the
    # default) to let the agent self-discover the authoritative containerd socket at startup
    # (correct on both kubeadm/system-containerd and RKE2/k3s nodes, without operator action —
    # this is what actually fixes the RKE2 dual-containerd failure). Set override.socket ONLY
    # to force the agent to use exactly that socket; it fails loud at startup (refuses to
    # start) rather than silently falling back to self-discovery if that socket does not
    # actually own the agent's own pod sandbox. override.runRoot/override.stateRoot default to
    # the directory of override.socket when left empty (see containerd_discovery.go
    # buildContainerdCandidates); set them explicitly only for a layout where that's wrong.
    override:
      socket: ""
      runRoot: ""
      stateRoot: ""
  # cni.extraConfDir: an additional host CNI conf directory to mount and scan, alongside
  # the canonical /etc/cni/net.d that nmcregistrar.detectCNI() (internal/agent/nmcregistrar/
  # registrar.go) checks by default. Needed because some distros do not populate the
  # canonical path: k3s writes its embedded-Flannel conflist to
  # /var/lib/rancher/k3s/agent/etc/cni/net.d/10-flannel.conflist instead, leaving
  # /etc/cni/net.d empty, which otherwise makes detectCNI() report "unknown" and the NMC
  # CR's spec.networkCapability.cniPlugin does not reflect ground truth. Empty string
  # (default) disables the extra mount/scan — set for k3s deploys.
  cni:
    extraConfDir: ""
  # ADR-0299: the agent's host-namespace statfs (cmd/agent/main.go:99, via
  # /proc/1/root under hostPID) is denied by containerd's default AppArmor
  # profile (cri-containerd.apparmor.d) on substrates where that profile is
  # in enforce mode against host-init-userns ptrace/proc reads (confirmed via
  # live audit evidence: "apparmor=\"DENIED\" operation=\"ptrace\" ...
  # profile=\"cri-containerd.apparmor.d\" ... peer=\"unconfined\""). Default
  # "unconfined" is a no-op on substrates that do not exhibit this denial
  # (e.g. kind/docker); only set otherwise on substrates that do (e.g. the
  # standing KVM/containerd cluster).
  #
  # ADR-0300: narrowed from "unconfined" (ADR-0299 stopgap) to the custom
  # least-privilege profile "localhost/podmotion-agent" — containerd's default
  # cri-containerd base PLUS exactly one added rule (ptrace (read)
  # peer=unconfined) for the mustEnsureCheckpointTmpfs host statfs. The profile
  # is loaded onto each node by the install-apparmor-profile init container in
  # the DaemonSet. "unconfined" remains selectable (--set
  # agent.apparmorProfile=unconfined) as an explicit degraded-but-working
  # fallback for substrates where the profile has not been loaded or fails to
  # parse.
  apparmorProfile: localhost/podmotion-agent
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  # SD-1-NETNS-BROKER (ADR-0148 Amendment): the privileged netns-broker sidecar.
  # Same image as the agent, invoked via args: ["netns-broker"]. It originally did only
  # per-migration netns bind/teardown, but its responsibility has grown: exec_start now
  # spawns the CRIU restore wrapper as the broker's own child, so the broker's cgroup
  # transiently hosts the entire resident memory of EVERY CONCURRENT restore destined for
  # this node (up to MaxConcurrentMigrationsDestination, default 2 — nmcregistrar/registrar.go)
  # plus the broker daemon itself, until each restored tree is individually relocated by a
  # separate move_cgroup op (ADR-0372). memory.limit is sized as
  # broker-baseline(16Mi) + CRIU-overhead(64Mi x N) + per-workload-budget(512Mi x N), N=2 =
  # 1168Mi, rounded to 1280Mi. The limits below are a stopgap ceiling raise, NOT a fix for
  # that underlying unbounded-cgroup-charging defect — see ADR-0372 for the full mechanism
  # and corrected math, and ADR-0373 for the tracked durable-fix follow-up.
  netnsBroker:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 200m
        memory: 1280Mi
  # ADR-SEC-A §2.1 (C-330): agent mTLS material. Default true — fail-closed. Mounted at
  # /etc/podmotion/tls/{tls.crt,tls.key,ca.crt}. Without it the agent refuses to start (default
  # build) rather than serving plaintext on the privileged host-network :9090.
  tls:
    enabled: true
    secretName: podmotion-agent-tls
  # ADR-0039 SD-5 / ADR-0148: CRIU-scoped seccomp profile for the agent container.
  # type=Localhost references a profile on the node's kubelet seccomp root
  # (<kubelet-root>/seccomp/podmotion/agent-criu.json). The profile ships in
  # charts/podmotion/profiles/agent-criu.json and must be installed onto each node's
  # seccomp dir out-of-band (DaemonSet installer / node image). This control is only
  # MEANINGFUL once agent privileged:true is dropped (SD-1); until then a privileged
  # container can issue any syscall regardless of the filter. Set enabled=true to wire
  # securityContext.seccompProfile on the agent container.
  seccompProfile:
    enabled: false
    type: Localhost
    localhostProfile: podmotion/agent-criu.json

checkpoint:
  # registry: use an in-cluster OCI registry for checkpoint staging (cross-AZ / cross-cluster)
  # p2p: direct node-to-node gRPC streaming (same-DC, RTT < 50ms)
  transferMode: p2p
  registry:
    url: ""
    secret: ""
  # Maximum time to retain a checkpoint artifact before GC (seconds)
  retentionSeconds: 3600

scheduler:
  # ADR-0364 (Part B2 of Task #20): unchanged from the pre-existing chart default (true).
  # Flipping this true (already the default) now renders a real podmotion-scheduler
  # Deployment/ConfigMap/RBAC (scheduler-deployment.yaml, scheduler-configmap.yaml,
  # scheduler-rbac.yaml) instead of nothing — but the image it runs is only real once
  # ADR-0362 Part B1 lands. The live KVM deploy path (hack/kvm-cluster.sh) passes
  # --set scheduler.enabled=true / --set webhook.podMutation.enabled=true since commit
  # 7b2ecb53 (2026-07-27), and ADR-0416 brought the kind, k3s and EC2 quickstart paths
  # to the same parity — every supported install path now matches this chart-level
  # default rather than overriding it back to false. Note that each of those paths also
  # overrides scheduler.image.* at install time to a locally built/loaded image; the
  # remote default below is not pullable on a dev substrate. Do not flip this to false: the
  # _coherence-checks.tpl guard (ADR-0360) fails render on a bare `helm template` (no
  # overrides) if scheduler.enabled=false while webhook.podMutation.enabled=true (also
  # default true) — the two defaults are a matched pair.
  enabled: true
  profileName: podmotion-scheduler
  image:
    repository: ghcr.io/podmotion/podmotion-scheduler
    tag: latest
    pullPolicy: IfNotPresent
  # A scheduler is naturally leader-elected and can run >1 replica, but default 1 keeps
  # parity with operator.replicas default dev behavior and avoids exercising the
  # multi-replica leader-election path by default (ADR-0364 Decision §1).
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

descheduler:
  enabled: false

webhook:
  certManager:
    enabled: true
  # ADR-0039 SD-6 / HOLD-B: the agent exec-block ValidatingWebhookConfiguration (deny
  # exec/attach/ephemeralcontainers + nodes/proxy against the privileged agent). Default true
  # and INDEPENDENT of cert-manager — on substrates without cert-manager (kind/dev) the chart
  # mints a self-signed serving cert and inlines the matching caBundle, and the operator is
  # wired with --webhook-cert-path so its webhook server actually serves the handler.
  # Set false ONLY to deliberately disable the SD-6 exec-block control.
  agentExecBlock:
    enabled: true
  # Sprint52 diagnosis fix: the pod-mutating webhook (mpod.podmotion.io, /mutate-core-v1-pod)
  # that injects schedulerName, the scheduling gate, and the CNI IPAM pin annotation onto
  # migration replacement pods. Previously there was NO MutatingWebhookConfiguration rule
  # routing pods to this handler at all, in any chart history, and the one rule that did
  # exist (mpodmigration.kb.io, for the PodMigration CR) was gated solely behind
  # certManager.enabled — so on the standing KVM dev cluster (certManager.enabled=false) zero
  # MutatingWebhookConfiguration objects were installed and injectIPAMAnnotation never ran.
  # Default true and INDEPENDENT of cert-manager, mirroring agentExecBlock above: on
  # substrates without cert-manager the chart mints a self-signed serving cert (shared with
  # the exec-block secret, podmotion-webhook-tls) and inlines the matching caBundle.
  # Set false ONLY to deliberately disable replacement-pod mutation (migrations will then
  # run without scheduler pinning, the checkpoint scheduling gate, or IP-preservation pins).
  # ADR-0359: as of this ADR the controller no longer pins spec.NodeName directly either
  # (that pin raced the scheduling gate above and defeated it), so disabling podMutation
  # now ALSO forfeits node binding entirely — the replacement pod falls through to the
  # default Kubernetes scheduler with whatever constraints the source pod happened to carry,
  # which may not be the node the checkpoint image was staged on.
  podMutation:
    enabled: true
  # ADR-0401: the eviction-interception MutatingWebhookConfiguration
  # (meviction.podmotion.io, /mutate-core-v1-pod-eviction). Blocks eviction of a pod while a
  # PodMigration is active for it, and FAILS CLOSED (failurePolicy: Fail + deny-on-unverifiable
  # handler) so a stressed/partitioned control plane cannot evict an in-flight migration source.
  # Default true and INDEPENDENT of cert-manager, mirroring agentExecBlock/podMutation: on
  # substrates without cert-manager the chart mints a self-signed serving cert and inlines the
  # matching caBundle. The Fail blast radius is bounded by a namespaceSelector excluding the
  # operator/system namespaces, timeoutSeconds: 5, and a retriable 429 denial. Set false ONLY to
  # deliberately disable source-pod eviction protection (migrating pods then become evictable
  # mid-migration in the field — a constitutional source-pod-protection regression, rule 5).
  eviction:
    enabled: true

networkPolicy:
  enabled: false

installCRDs: false

# nodeRequirements documents substrate prerequisites for the agent DaemonSet.
# The netns-mount-prep init container satisfies runPodmotionSharedMount automatically
# on most substrates. On non-rshared substrates where the init container's
# mount --make-shared is blocked, this must be satisfied manually before migration.
nodeRequirements:
  runPodmotionSharedMount: true  # /run/podmotion must be rshared on every node

metrics:
  enabled: true
  serviceMonitor:
    enabled: false

# AWS-specific: tag node images and enable spot reclaim trigger
#
# To enable spot instance reclamation automation:
#   1. Set aws.spotReclaimTrigger: true  — activates SpotReclaimReconciler in the operator
#      (passes --enable-spot-reclaim flag to the operator Deployment)
#   2. Set aws.imdsPollingEnabled: true  — starts the IMDS poller in the node agent DaemonSet
#   3. Tune aws.spotReclaimTimeoutSeconds if your workloads need a different window.
#      Must be ≥10 and ≤115 (AWS 2-minute window minus a minimum 5 s buffer).
aws:
  spotReclaimTrigger: false
  nodeImageFamily: podmotion-node-ubuntu-22.04
  # imdsPollingEnabled enables the IMDS poller in the node agent.
  # Only effective on AWS instances; safe to leave true on non-AWS nodes (polls will 404).
  imdsPollingEnabled: true
  # spotReclaimTimeoutSeconds is the CompletionTimeoutSeconds set on PodMigration CRs
  # created by the spot reclaim controller. Should be < 120 (AWS notice window).
  spotReclaimTimeoutSeconds: 90

# podmotion-demo is an OPTIONAL add-on (charts/podmotion-demo/) — disabled by
# default. Enable explicitly per-cluster with --set podmotion-demo.enabled=true;
# it must never come up as a side effect of a plain helm install/upgrade of the
# core operator chart.
podmotion-demo:
  enabled: false
