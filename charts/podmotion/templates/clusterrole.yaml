apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: podmotion-manager-role
  labels:
    app.kubernetes.io/name: podmotion
    app.kubernetes.io/component: operator
    app.kubernetes.io/managed-by: {{ .Release.Service }}
rules:
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch, update]
  - apiGroups: [""]
    resources: [nodes, persistentvolumeclaims]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [create, delete, get, list, update, watch]
  - apiGroups: [""]
    resources: [pods/status]
    verbs: [get]
  - apiGroups: [apps]
    resources: [statefulsets]
    verbs: [get, list, watch]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, patch, update, watch]
  - apiGroups: [migration.podmotion.io]
    resources:
      - migrationcheckpoints
      - migrationpolicies
      - migrationwebhookconfigs
      - nodemigrationcapacities
      - podmigrations
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [migration.podmotion.io]
    resources:
      - migrationcheckpoints/finalizers
      - migrationpolicies/finalizers
      - migrationwebhookconfigs/finalizers
      - nodemigrationcapacities/finalizers
      - podmigrations/finalizers
    verbs: [update]
  - apiGroups: [migration.podmotion.io]
    resources:
      - migrationcheckpoints/status
      - migrationpolicies/status
      - migrationwebhookconfigs/status
      - nodemigrationcapacities/status
      - podmigrations/status
    verbs: [get, patch, update]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [admissionregistration.k8s.io]
    resources: [validatingwebhookconfigurations, mutatingwebhookconfigurations]
    verbs: [get, list, watch, patch, update]
  # ADR-0322: the Cilium ipcache/CiliumEndpoint handoff readiness check (injectIPHandoff,
  # immediately before verifyDataplaneReachability) polls cilium.io/v2 CiliumEndpoint via
  # DynamicClient. This runs in the OPERATOR reconciler (podmigration_controller.go), so the
  # grant belongs on podmotion-manager-role, not podmotion-agent-role. ClusterRole (not a
  # namespaced Role) is deliberate: migrated workloads and their CiliumEndpoint objects can
  # originate from any application namespace, matching the operator's existing cluster-scoped
  # rules for other cross-namespace resources above.
  - apiGroups: [cilium.io]
    resources: [ciliumendpoints]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: podmotion-agent-role
  labels:
    app.kubernetes.io/name: podmotion
    app.kubernetes.io/component: agent
    app.kubernetes.io/managed-by: {{ .Release.Service }}
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  # Restore-time re-attach mount resolution (resolveReattachMounts, server.go) reads the
  # migrating pod's PVCs to map each claim to its backing PV name, then resolves the
  # destination kubelet volume host dir for the CRIU --ext-mount-map. Without get/list/watch
  # on persistentvolumeclaims the claim->PV lookup returns empty, the re-attach host target
  # never resolves, and the RWX re-attach restore fails closed ("reattach host target
  # unresolved"). Required for the Tier0 shared/RWX re-attach storage path.
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [get, list, watch]
  - apiGroups: [migration.podmotion.io]
    resources: [nodemigrationcapacities]
    verbs: [create, get, list, patch, update, watch]
  - apiGroups: [migration.podmotion.io]
    resources: [nodemigrationcapacities/status]
    verbs: [get, patch, update]
  - apiGroups: [migration.podmotion.io]
    resources: [migrationcheckpoints]
    verbs: [create, get, list, watch, patch, update]
  - apiGroups: [migration.podmotion.io]
    resources: [migrationcheckpoints/status]
    verbs: [get, patch, update]
  # Agent checkpoint path watches the PodMigration CR via an informer
  # (CR lookup during Checkpoint RPC). Without list/watch the informer never
  # syncs and every Checkpoint RPC fails with "failed waiting for Informer to sync".
  - apiGroups: [migration.podmotion.io]
    resources: [podmigrations]
    verbs: [get, list, watch]
  - apiGroups: [migration.podmotion.io]
    resources: [podmigrations/status]
    verbs: [get, patch, update]
  # ADR-0195 C-SEC-1: agent emits corev1.Events (CRIUImageInconsistency, ExternalMountDropped,
  # ExternalMountUnresolved) via server.go:5735/5786/5836. Without this rule, Create(event)
  # fails with "events is forbidden: User system:serviceaccount:... cannot create resource events".
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch, update]
