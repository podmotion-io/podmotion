{{- /*
ADR-0039 SD-6 / HOLD-B: serving-cert Secret for the operator webhook server on substrates
WITHOUT cert-manager. Provides the same secret name (podmotion-webhook-tls) the cert-manager
Certificate would have created, so the deployment volume wiring is identical on both paths.
Renders when ANY operator-served webhook (exec-block, pod-mutation sprint52 fix, or the
ADR-0401 eviction guard) is requested, AND cert-manager is NOT managing certs — all of them
share the one operator-served TLS listener, so any one needing a self-signed cert is sufficient.
*/ -}}
{{- if and (or (include "podmotion.execBlockEnabled" .) (include "podmotion.podMutationEnabled" .) (include "podmotion.evictionEnabled" .)) (not .Values.webhook.certManager.enabled) }}
{{- include "podmotion.webhookSelfSignedCert" . -}}
{{- $c := index . "podmotionWebhookCert" }}
apiVersion: v1
kind: Secret
metadata:
  name: podmotion-webhook-tls
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: podmotion
    app.kubernetes.io/component: security
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: kubernetes.io/tls
data:
  tls.crt: {{ $c.Cert | b64enc }}
  tls.key: {{ $c.Key | b64enc }}
  ca.crt: {{ $c.CA | b64enc }}
{{- end }}
