{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: podmotion-operator-netpol
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: podmotion
    app.kubernetes.io/component: operator
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  podSelector:
    matchLabels:
      app: podmotion-operator
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: 9443
          protocol: TCP
        - port: 8080
          protocol: TCP
        - port: 8081
          protocol: TCP
  egress:
    - ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app: podmotion-agent
      ports:
        - port: {{ .Values.agent.grpcPort }}
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: podmotion-agent-netpol
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: podmotion
    app.kubernetes.io/component: agent
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  podSelector:
    matchLabels:
      app: podmotion-agent
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: podmotion-operator
        - podSelector:
            matchLabels:
              app: podmotion-agent
      ports:
        - port: {{ .Values.agent.grpcPort }}
          protocol: TCP
        - port: {{ .Values.agent.metricsPort }}
          protocol: TCP
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: podmotion-agent
      ports:
        - port: {{ .Values.agent.grpcPort }}
          protocol: TCP
    - ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
{{- end }}
