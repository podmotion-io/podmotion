apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: podmotion-agent
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: podmotion
    app.kubernetes.io/component: agent
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  selector:
    matchLabels:
      app: podmotion-agent
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: podmotion-agent
        app.kubernetes.io/name: podmotion
        app.kubernetes.io/component: agent
    spec:
      serviceAccountName: podmotion-agent
      hostPID: true
      hostNetwork: true
      # Agent needs to be on every worker node that can participate in migrations.
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
        - operator: Exists
          effect: NoSchedule
        - operator: Exists
          effect: NoExecute
      initContainers:
        - name: netns-mount-prep
          image: busybox:1.36
          securityContext:
            privileged: true
          command: ["/bin/sh", "-c"]
          args:
            - |
              mkdir -p /run/podmotion
              mount --make-shared /run/podmotion || mount --bind /run/podmotion /run/podmotion && mount --make-shared /run/podmotion
              echo "netns mount prep complete"
          volumeMounts:
            - name: run-podmotion
              mountPath: /run/podmotion
        - name: init-checkpoint-tmpfs
          image: busybox:1.36
          securityContext:
            privileged: true
          command:
            - sh
            - -c
            - |
              mkdir -p /host-run/podmotion/checkpoints
              chmod 0700 /host-run/podmotion/checkpoints
              nsenter --mount=/proc/1/ns/mnt -- \
                sh -c 'mountpoint -q /run/podmotion/checkpoints || \
                  mount -t tmpfs -o mode=0700,size=4096m tmpfs /run/podmotion/checkpoints'
          volumeMounts:
            - name: host-run
              mountPath: /host-run
      containers:
        - name: agent
          image: "{{ .Values.agent.image.repository }}:{{ .Values.agent.image.tag }}"
          imagePullPolicy: {{ .Values.agent.image.pullPolicy }}
          command: [/agent]
          args:
            - --grpc-port={{ .Values.agent.grpcPort }}
            - --metrics-port={{ .Values.agent.metricsPort }}
            - --node-name=$(NODE_NAME)
            {{- if .Values.aws.imdsPollingEnabled }}
            - --enable-imds-polling
            - --spot-reclaim-timeout={{ .Values.aws.spotReclaimTimeoutSeconds }}
            {{- end }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: grpc
              containerPort: {{ .Values.agent.grpcPort }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.agent.metricsPort }}
              protocol: TCP
          resources:
            {{- toYaml .Values.agent.resources | nindent 12 }}
          securityContext:
            privileged: true
          volumeMounts:
            - name: criu-socket
              mountPath: /var/run/criu
            - name: containerd-socket
              mountPath: /run/containerd/containerd.sock
            - name: nri-socket
              mountPath: /var/run/nri
            - name: sys
              mountPath: /sys
            - name: host-usr-sbin
              mountPath: /usr/sbin
              readOnly: true
            - name: host-var-lib-podmotion
              mountPath: /var/lib/podmotion
            - name: host-cni-conf
              mountPath: /etc/cni/net.d
              readOnly: true
            - name: run-podmotion
              mountPath: /run/podmotion
              mountPropagation: HostToContainer
            - name: host-var-run-netns
              mountPath: /var/run/netns
              mountPropagation: HostToContainer
              readOnly: true
      volumes:
        - name: criu-socket
          hostPath:
            path: /var/run/criu
            type: DirectoryOrCreate
        - name: containerd-socket
          hostPath:
            path: /run/containerd/containerd.sock
            type: Socket
        - name: sys
          hostPath:
            path: /sys
        - name: nri-socket
          hostPath:
            path: /var/run/nri
            type: DirectoryOrCreate
        - name: host-usr-sbin
          hostPath:
            path: /usr/sbin
            type: Directory
        - name: host-var-lib-podmotion
          hostPath:
            path: /var/lib/podmotion
            type: DirectoryOrCreate
        - name: host-run
          hostPath:
            path: /run
            type: Directory
        - name: host-cni-conf
          hostPath:
            path: /etc/cni/net.d
            type: DirectoryOrCreate
        - name: run-podmotion
          hostPath:
            path: /run/podmotion
            type: DirectoryOrCreate
        - name: host-var-run-netns
          hostPath:
            path: /var/run/netns
            type: DirectoryOrCreate
