apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: podmotion-agent
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: podmotion
    app.kubernetes.io/component: agent
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  selector:
    matchLabels:
      app: podmotion-agent
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: podmotion-agent
        app.kubernetes.io/name: podmotion
        app.kubernetes.io/component: agent
      annotations:
        # ADR-0299: containerd's default AppArmor profile
        # (cri-containerd.apparmor.d) denies the main agent container's
        # host-namespace ptrace/proc read (cmd/agent/main.go:99 statfs via
        # /proc/1/root) on substrates where that profile runs in enforce
        # mode against the host init userns (peer="unconfined"). Scoped to
        # the "agent" container only. Default value "unconfined" -> this
        # annotation renders as "unconfined", the Kubernetes-recognized
        # no-op equivalent to the container runtime default, so this is a
        # true no-op on kind/docker where the denial is not observed.
        container.apparmor.security.beta.kubernetes.io/agent: {{ .Values.agent.apparmorProfile }}
    spec:
      serviceAccountName: podmotion-agent
      hostPID: true
      hostNetwork: true
      # Agent needs to be on every worker node that can participate in migrations.
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
        - operator: Exists
          effect: NoSchedule
        - operator: Exists
          effect: NoExecute
      initContainers:
        - name: netns-mount-prep
          image: busybox:1.36
          # ADR-0148 SD-1: drop privileged; this init only performs bind + make-shared
          # mounts on /run/podmotion, which require CAP_SYS_ADMIN (mount/umount2). No
          # netlink/route work happens here, so NET_ADMIN is not added.
          securityContext:
            privileged: false
            capabilities:
              drop: ["ALL"]
              add: ["SYS_ADMIN"]
            allowPrivilegeEscalation: false
          command: ["/bin/sh", "-c"]
          args:
            - |
              mkdir -p /run/podmotion
              mount --make-shared /run/podmotion || mount --bind /run/podmotion /run/podmotion && mount --make-shared /run/podmotion
              echo "netns mount prep complete"
          volumeMounts:
            - name: run-podmotion
              mountPath: /run/podmotion
        - name: install-apparmor-profile
          image: busybox:1.36
          # ADR-0300: loads the narrow podmotion-agent AppArmor profile onto
          # this node's /etc/apparmor.d and activates it via apparmor_parser,
          # ordered BEFORE init-checkpoint-tmpfs so the profile is enforcing
          # before the main agent container (which is annotated
          # localhost/podmotion-agent) starts. Mirrors the init-checkpoint-tmpfs
          # privileged-init-container pattern (ADR-0148 SD-1-INIT-B) for the
          # same reason: apparmor_parser -r writing into the host's live
          # AppArmor policy cache requires CAP_MAC_ADMIN/CAP_SYS_ADMIN evaluated
          # against the HOST (init) user namespace, not this container's own —
          # privileged:true is the only securityContext that places it there.
          # Idempotent (apparmor_parser -r replaces/reloads) and re-runs on
          # every rollout, so profile drift between the ConfigMap and the host
          # file cannot occur.
          securityContext:
            privileged: true
          command:
            - sh
            - -c
            - |
              set -e
              cp /profile/podmotion-agent.profile /host-etc-apparmor-d/podmotion-agent
              nsenter --mount=/proc/1/ns/mnt --pid=/proc/1/ns/pid -- \
                apparmor_parser -r /etc/apparmor.d/podmotion-agent
          volumeMounts:
            - name: apparmor-profile-src
              mountPath: /profile
              readOnly: true
            - name: host-etc-apparmor-d
              mountPath: /host-etc-apparmor-d
        - name: init-checkpoint-tmpfs
          image: busybox:1.36
          # ADR-0148 SD-1 (Amendment SD-1-INIT-B): init-ONLY privilege for host
          # mount-namespace tmpfs setup. This init opens the host PID 1 mount-namespace
          # handle (/proc/1/ns/mnt), setns(CLONE_NEWNS) into it, then mounts a tmpfs at
          # /run/podmotion/checkpoints. The owning user namespace of that mount namespace
          # is the HOST (init) user namespace.
          #
          # Why privileged:true here and ONLY here (HOLD-A resolution):
          #   - setns(CLONE_NEWNS) into a mount namespace requires CAP_SYS_ADMIN effective
          #     in the user namespace that OWNS the target mount ns — i.e. the HOST init
          #     user namespace, NOT this container's capability set. A non-privileged
          #     container with capabilities.add:[SYS_ADMIN,SYS_PTRACE] holds those caps only
          #     against namespaces it owns; the kernel ns_capable() check against the
          #     host-owned mount ns fails (EPERM on setns / mount), even though the handle
          #     open (a ptrace_may_access gate) succeeded. privileged:true is the only
          #     securityContext that places this container in the host user namespace with
          #     the full host capability bounding+effective set, so the host-owned-ns
          #     ns_capable() checks pass.
          #   - SD-1-INIT-A added SYS_PTRACE for the /proc/1/ns/mnt handle open and assumed
          #     SYS_ADMIN would carry the setns+mount; under privileged:false it does not,
          #     because those operations are evaluated against the HOST user namespace.
          #
          # Scope of this exception: this is the SOLE privileged container in the pod. The
          # main agent and the other two init containers are de-privileged under SD-1 — the
          # main agent (which holds the broad, long-lived attack surface) is the primary
          # de-privileging win. This one short-lived init container, which exits before the
          # agent serves any gRPC, carries narrowly-scoped "init-only privilege for tmpfs
          # host-mount-ns setup." hostPID stays true at the pod level so /proc/1 resolves to
          # the host init.
          securityContext:
            privileged: true
          command:
            - sh
            - -c
            - |
              mkdir -p /host-run/podmotion/checkpoints
              chmod 0700 /host-run/podmotion/checkpoints
              nsenter --mount=/proc/1/ns/mnt -- \
                sh -c 'mountpoint -q /run/podmotion/checkpoints || \
                  mount -t tmpfs -o mode=0700,size=4096m tmpfs /run/podmotion/checkpoints'
          volumeMounts:
            - name: host-run
              mountPath: /host-run
        # ADR-0183 r1: install podmotion-criu-wrapper onto the host node filesystem.
        # nsenterCmd (internal/agent/server/server.go) joins the host mount namespace
        # (--mount=/proc/1/ns/mnt, with hostPID: true above) and execve's the wrapper by
        # absolute path. That path resolves against the HOST rootfs, NOT this container's
        # overlay — so the wrapper MUST be copied onto the host. The agent image is its own
        # installer (in-image binary == exec'd binary, no version skew). Authenticity comes
        # from the OCI image digest verified by the runtime on pull; there is no co-located
        # .sha256 checksum (security theater per ADR-0183 S1/C1). Install target is the
        # PodMotion-owned, non-PATH dir /opt/podmotion/bin (ADR-0183 S2), NOT host system PATH.
        - name: install-criu-wrapper
          image: "{{ .Values.agent.image.repository }}:{{ .Values.agent.image.tag }}"
          imagePullPolicy: {{ .Values.agent.image.pullPolicy }}
          # ADR-0148 SD-1: drop privileged. This init only copies the criu-wrapper binary
          # onto the host (mkdir + install -m 0755) into the PodMotion-owned hostPath dir.
          # As uid 0, DAC_OVERRIDE is the minimum needed to write/chmod regardless of the
          # host dir's perms; no ptrace, mount, or netlink work happens here.
          securityContext:
            privileged: false
            runAsUser: 0
            capabilities:
              drop: ["ALL"]
              add: ["DAC_OVERRIDE"]
            allowPrivilegeEscalation: false
          command:
            - sh
            - -c
            - "mkdir -p /host-opt-podmotion-bin && install -m 0755 /usr/local/bin/podmotion-criu-wrapper /host-opt-podmotion-bin/podmotion-criu-wrapper"
          volumeMounts:
            - name: host-opt-podmotion-bin
              mountPath: /host-opt-podmotion-bin
      containers:
        # SD-1-NETNS-BROKER (ADR-0148 Amendment): the SOLE long-lived privileged:true
        # container in the pod. It serves ONLY the netns-broker Unix socket
        # (/run/podmotion/netns-broker.sock, mode 0600) and does ONLY per-migration
        # netns bind/teardown in the HOST mount namespace. It speaks no gRPC. The
        # irreducible host-mount-ns bind privilege (CAP_SYS_ADMIN mount/umount2)
        # lives here so the main agent below can run privileged:false. Same image as
        # the agent (no version skew) — different entrypoint via args: ["netns-broker"]
        # (cmd/agent/main.go subcommand dispatch). Mirrors the SD-1-INIT-B precedent.
        - name: netns-broker
          image: "{{ .Values.agent.image.repository }}:{{ .Values.agent.image.tag }}"
          imagePullPolicy: {{ .Values.agent.image.pullPolicy }}
          command: [/agent]
          args: ["netns-broker"]
          securityContext:
            # Irreducible: setns(CLONE_NEWNS) into the HOST init mount namespace
            # (/proc/1/ns/mnt) to mount/umount2 the per-migration netns bind requires
            # CAP_SYS_ADMIN effective in the user namespace that OWNS that mount ns —
            # the HOST init user namespace. privileged:true is the only securityContext
            # that places this container there with the full host capability set (same
            # reasoning as the SD-1-INIT-B init-checkpoint-tmpfs container above).
            privileged: true
          volumeMounts:
            - name: run-podmotion
              mountPath: /run/podmotion
              # Bidirectional: the broker creates netns bind-mounts in the host mount
              # namespace; the agent consumes them via HostToContainer. The shared
              # /run/podmotion mount carries both the socket and the netns dir.
              mountPropagation: Bidirectional
            # ADR-0349 sprint46B2 cycle-1 (Architect B — substrate root cause). The broker's
            # netns_exec NetnsPath mode (ADR-0326) VALIDATES a /var/run/netns/cni-<id> handle
            # with an IN-PROCESS filepath.EvalSymlinks (validateNetnsPath, broker.go:135) and
            # only THEN runs the op via `nsenter --mount=/proc/1/ns/mnt --net=<path>` in the
            # HOST mount namespace. Without this mount the broker's OWN mount namespace has no
            # /run/netns (the CNI bind dir), so EvalSymlinks fails with
            # `lstat /run/netns: no such file or directory` and the gate REJECTS a valid handle
            # BEFORE the op ever runs — the gate validates a filesystem view the operation does
            # not use. Live-decoded on pm-w2 (docs/sprints/sprint46B2/live-proof-cycle1.md: the
            # agent-side ReadReplVethMAC bind read returned empty via that exact lstat error;
            # broker mount-ns probe confirms `ls /run/netns` -> "No such file or directory").
            # The agent container already mounts host-var-run-netns for the same reason (its
            # os.Open of the handle succeeds); give the broker the same READ-ONLY view so its
            # containment gate validates against the same mounts it enters. /var/run is a symlink
            # to /run, so this surfaces the CNI bind dir at /run/netns; HostToContainer propagates
            # binds CNI creates after the broker starts. This makes the broker's netns visibility
            # consistent — it does NOT change MAC resolution, which reads the restored process's
            # own netns via SrcPID (/proc/<pid>/ns/net), never a bind path.
            - name: host-var-run-netns
              mountPath: /var/run/netns
              mountPropagation: HostToContainer
              readOnly: true
          resources:
            {{- toYaml .Values.agent.netnsBroker.resources | nindent 12 }}
        - name: agent
          image: "{{ .Values.agent.image.repository }}:{{ .Values.agent.image.tag }}"
          imagePullPolicy: {{ .Values.agent.image.pullPolicy }}
          command: [/agent]
          args:
            - --grpc-port={{ .Values.agent.grpcPort }}
            - --metrics-port={{ .Values.agent.metricsPort }}
            - --node-name=$(NODE_NAME)
            {{- if .Values.aws.imdsPollingEnabled }}
            - --enable-imds-polling
            - --spot-reclaim-timeout={{ .Values.aws.spotReclaimTimeoutSeconds }}
            {{- end }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # sprint50 (k3s compat): standard kubeadm/containerd installs use
            # /run/containerd/{containerd.sock,io.containerd.runtime.v2.task/k8s.io/...} and
            # /var/lib/containerd/io.containerd.runtime.v2.task/k8s.io/... . k3s's embedded
            # containerd uses different roots (UNVERIFIED-EXTERNAL — see
            # docs/sprints/sprint50-k3s/K3S-COMPATIBILITY-PLAN.md §0 items 1-4; confirm against
            # a live k3s node before relying on a non-default override). These three values
            # drive every containerd socket/bundle-path construction in the agent
            # (internal/agent/server/containerd_paths.go, internal/agent/seccomp/manager.go) —
            # override via agent.containerd.* on a k3s deploy instead of patching Go code.
            - name: PODMOTION_CONTAINERD_RUN_ROOT
              value: {{ dir .Values.agent.containerd.socketPath | quote }}
            - name: PODMOTION_CONTAINERD_SOCKET
              value: {{ .Values.agent.containerd.socketPath | quote }}
            - name: PODMOTION_CONTAINERD_STATE_ROOT
              value: {{ .Values.agent.containerd.stateDir | quote }}
          ports:
            - name: grpc
              containerPort: {{ .Values.agent.grpcPort }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.agent.metricsPort }}
              protocol: TCP
          resources:
            {{- toYaml .Values.agent.resources | nindent 12 }}
          securityContext:
            # ADR-0148 D2/D3 SD-1: drop privileged:true (~18 caps) in favour of the
            # trace-derived minimum set. drop ALL, add only what CRIU + eBPF need:
            #   SYS_PTRACE — CRIU dump (PTRACE_SEIZE, process_vm_readv/writev)
            #   SYS_ADMIN  — CRIU mount-ns/setns/mount/umount2/userfaultfd (irreducible)
            #   CHECKPOINT_RESTORE — CRIU 4.x kerndat init (cap 40, Linux 5.9+); CAP_CHECKPOINT_RESTORE
            #                gates the MOVE_MOUNT_SET_GROUP probe (criu/kerndat.c:1129) and
            #                checkpoint/restore-privileged operations. Kernel here is 6.17.
            #   NET_ADMIN  — eBPF TC/XDP attach, veth/neigh/route/FDB, zero-window hold
            #   BPF        — bpf() program load + map ops (k>=5.8 split out of SYS_ADMIN)
            #   PERFMON    — perf_event_open for perf/tracepoint-anchored programs (k>=5.8)
            # BPF/PERFMON gated on agent.kernelGE58 — pre-5.8 nodes get these via SYS_ADMIN.
            privileged: false
            capabilities:
              drop: ["ALL"]
              add:
                - SYS_PTRACE
                - SYS_ADMIN
                - CHECKPOINT_RESTORE
                # SD-1-DAC (ADR-0148): CRIU pre-dump opens /proc/<pid>/map_files to collect
                # the target's memory mappings (proc_parse.c:829). Under privileged:false the
                # DAC owner-only restriction on map_files denies that open ("Permission
                # denied") for any process the agent does not own. DAC_READ_SEARCH bypasses
                # file read/search DAC checks, restoring map_files access without privileged.
                - DAC_READ_SEARCH
                # ADR-0227: CRIU dump_task_rlimits() (criu/cr-dump.c:388) reads the target's
                # rlimits via prlimit64(target_pid). Reading another task's limits across a
                # user-namespace/credential boundary is gated by the kernel
                # check_prlimit_permission() — satisfied only by exact-uid match OR
                # CAP_SYS_RESOURCE in the target's userns. The agent runs in the host init
                # userns; the workload pod has its own creds, so CAP_SYS_RESOURCE is required.
                # (prlimit64 is already seccomp-allowed; this EPERM was a capability denial,
                # not a seccomp denial.) Not kernel-gated — CAP_SYS_RESOURCE predates 5.8.
                - SYS_RESOURCE
                - NET_ADMIN
                # ADR-0236 / ADR-0148: ADR-0158 InjectIPHandoff sends a gratuitous ARP to
                # flush stale neighbor caches at IP handoff. SendGratuitousARP opens an
                # AF_PACKET socket (socket(AF_PACKET, SOCK_RAW/SOCK_DGRAM)), which the kernel
                # gates on CAP_NET_RAW in packet_create() (net/packet/af_packet.c) — NOT
                # CAP_NET_ADMIN. Under drop:ALL the AF_PACKET socket() returned EPERM
                # ("operation not permitted") and the gratuitous ARP silently no-op'd
                # (non-fatal per ADR-0158, but it leaves neighbor caches stale at cutover).
                # The seccomp profile already allows socket(); this was a capability denial.
                - NET_RAW
                # ADR-0193/ADR-0095/ADR-0312: the agent sends SIGCONT to workload trees
                # (thawSourcePID / frozen_source_registry.go resume the SOURCE workload left
                # in SIGSTOP by --leave-stopped). Those processes run under the IMAGE's own
                # non-root uid (redis:7-alpine → uid 999, postgres:16-alpine → uid 70), a
                # credential the host-init-userns agent does not match. The kernel
                # check_kill_permission() (kernel/signal.c) authorizes kill() to a task with
                # different creds only on exact real/effective-uid match OR CAP_KILL in the
                # target's userns — so under drop:ALL the SIGCONT returned EPERM and the source
                # stayed frozen. Not kernel-gated — CAP_KILL predates 5.8. CAP_KILL is RETAINED
                # for these source-tree thaws (agent's own profile, permitted by AppArmor).
                # NOTE (ADR-0312): resuming the RESTORED tree is now delegated to the unconfined
                # netns-broker (its runtime-defined AppArmor peer label made a confined-agent
                # signal rule un-matchable); that path does not rely on this agent CAP_KILL.
                - KILL
                {{- if .Values.agent.kernelGE58 }}
                - BPF
                - PERFMON
                {{- end }}
            # ADR-0148 D3: CRIU PTRACE_SEIZE + parasite-code injection requires no_new_privs
            # CLEAR on the tracer. Does not widen surface (uid 0, no setuid binary in image).
            allowPrivilegeEscalation: true
            {{- if .Values.agent.seccompProfile.enabled }}
            # ADR-0039 SD-5 / ADR-0148: CRIU-scoped seccomp profile (arg-filtered ptrace,
            # default-deny). Only meaningful once privileged:true is dropped (SD-1).
            seccompProfile:
              type: {{ .Values.agent.seccompProfile.type }}
              {{- if eq .Values.agent.seccompProfile.type "Localhost" }}
              localhostProfile: {{ .Values.agent.seccompProfile.localhostProfile }}
              {{- end }}
            {{- end }}
          volumeMounts:
            - name: criu-socket
              mountPath: /var/run/criu
            - name: containerd-socket
              mountPath: {{ .Values.agent.containerd.socketPath }}
            # host /run, read-only: the checkpoint classifier reads runc's task run bundle
            # (/host-run/containerd/.../<taskID>/, incl. the `work` symlink and config.json) to
            # resolve and read criu-dump.log. Without this mount hostBundleDir()/resolveCtrDumpLogPath()
            # point at a path that does not exist in the agent mount namespace and the CRIU
            # diagnostic is never surfaced (postgres hard-fails on an opaque runc "exit status 1").
            - name: host-run
              mountPath: /host-run
              readOnly: true
            # host /var/lib/containerd, read-only: runc writes criu-dump.log into the task `work`
            # dir, which symlinks to /var/lib/containerd/io.containerd.runtime.v2.task/... — not
            # into the run bundle. resolveCtrDumpLogPath re-roots that target here so the classifier
            # can read the real CRIU dump failure (established-socket vs shmem vs mount).
            - name: host-var-lib-containerd
              mountPath: /host-var-lib-containerd
              readOnly: true
            - name: nri-socket
              mountPath: /var/run/nri
            - name: sys
              mountPath: /sys
            - name: host-usr-sbin
              mountPath: /usr/sbin
              readOnly: true
            - name: host-var-lib-podmotion
              mountPath: /var/lib/podmotion
            - name: host-cni-conf
              mountPath: /etc/cni/net.d
              readOnly: true
            - name: run-podmotion
              mountPath: /run/podmotion
              mountPropagation: HostToContainer
            - name: host-var-run-netns
              mountPath: /var/run/netns
              mountPropagation: HostToContainer
              readOnly: true
            {{- if .Values.agent.tls.enabled }}
            # ADR-SEC-A §2.1 (C-330): mount the mTLS material the agent fail-closed path requires.
            # Without this mount filesExist() is always false and the agent CrashLoopBackOffs
            # (default build) instead of serving plaintext. This is the load-bearing deploy fix.
            - name: agent-tls
              mountPath: /etc/podmotion/tls
              readOnly: true
            {{- end }}
      volumes:
        # ADR-0300: source of the podmotion-agent AppArmor profile, populated
        # from charts/podmotion/files/apparmor/podmotion-agent.profile via a
        # ConfigMap (see configmap-apparmor.yaml). Mounted read-only into the
        # install-apparmor-profile init container.
        - name: apparmor-profile-src
          configMap:
            name: podmotion-agent-apparmor-profile
        # ADR-0300: host /etc/apparmor.d — the init container copies the profile
        # here and apparmor_parser -r reads it from the host mount namespace.
        - name: host-etc-apparmor-d
          hostPath:
            path: /etc/apparmor.d
            type: Directory
        {{- if .Values.agent.tls.enabled }}
        - name: agent-tls
          secret:
            secretName: {{ .Values.agent.tls.secretName }}
            defaultMode: 0400
        {{- end }}
        - name: criu-socket
          hostPath:
            path: /var/run/criu
            type: DirectoryOrCreate
        - name: containerd-socket
          hostPath:
            path: {{ .Values.agent.containerd.socketPath }}
            type: Socket
        - name: sys
          hostPath:
            path: /sys
        - name: nri-socket
          hostPath:
            path: /var/run/nri
            type: DirectoryOrCreate
        - name: host-usr-sbin
          hostPath:
            path: /usr/sbin
            type: Directory
        - name: host-var-lib-podmotion
          hostPath:
            path: /var/lib/podmotion
            type: DirectoryOrCreate
        - name: host-run
          hostPath:
            path: /run
            type: Directory
        # host containerd state dir — holds the task `work` dirs where runc writes criu-dump.log.
        - name: host-var-lib-containerd
          hostPath:
            path: {{ .Values.agent.containerd.stateDir }}
            type: Directory
        - name: host-cni-conf
          hostPath:
            path: /etc/cni/net.d
            type: DirectoryOrCreate
        - name: run-podmotion
          hostPath:
            path: /run/podmotion
            type: DirectoryOrCreate
        - name: host-var-run-netns
          hostPath:
            path: /var/run/netns
            type: DirectoryOrCreate
        # ADR-0183 r1: PodMotion-owned host dir for the criu-wrapper binary install.
        # Mounted writable ONLY by the install-criu-wrapper init container; the main agent
        # container does not mount it (least host-writable surface).
        - name: host-opt-podmotion-bin
          hostPath:
            path: /opt/podmotion/bin
            type: DirectoryOrCreate
