apiVersion: apps/v1
kind: Deployment
metadata:
  name: podmotion-operator
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: podmotion
    app.kubernetes.io/component: operator
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: {{ .Values.operator.replicas }}
  selector:
    matchLabels:
      app: podmotion-operator
  template:
    metadata:
      labels:
        app: podmotion-operator
        app.kubernetes.io/name: podmotion
        app.kubernetes.io/component: operator
    spec:
      serviceAccountName: podmotion-operator
      securityContext:
        runAsNonRoot: true
        # fsGroup 65532 (distroless nonroot UID/GID) so the kubelet chowns mounted
        # secret volumes to this GID. Without it the operator (runAsNonRoot, UID 65532)
        # cannot read the root:root 0400 operator-agent-client-tls cert and CrashLoops
        # ("open /etc/podmotion/tls/tls.crt: permission denied"). Sprint 34 §P-VERIFY-D fix.
        fsGroup: 65532
      terminationGracePeriodSeconds: 10
      containers:
        - name: manager
          image: "{{ .Values.operator.image.repository }}:{{ .Values.operator.image.tag }}"
          imagePullPolicy: {{ .Values.operator.image.pullPolicy }}
          command: [/manager]
          env:
            - name: AGENT_IMAGE
              value: "{{ .Values.agent.image.repository }}:{{ .Values.agent.image.tag }}"
            - name: AGENT_IMAGE_PULL_POLICY
              value: {{ .Values.agent.image.pullPolicy | quote }}
            # ADR-SEC-C (GC-B7) M2: the operator derives the expected agent SPIFFE ID
            # (spiffe://podmotion.io/ns/<ns>/sa/podmotion-agent) from its runtime namespace so the
            # operator→agent peer pin is correct on non-default-namespace installs (never hardcoded).
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          args:
            - --leader-elect
            - --metrics-bind-address=:8080
            - --health-probe-bind-address=:8081
            {{- if .Values.aws.spotReclaimTrigger }}
            - --enable-spot-reclaim
            {{- end }}
            {{- if .Values.operator.featureGates }}
            - --feature-gates={{ .Values.operator.featureGates }}
            {{- end }}
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
            - name: webhook
              containerPort: 9443
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.operator.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            {{- /* ADR-0222 (3h-SYM): gate the webhook-certs mount on the same flag as the
                   webhook.yaml resources. Mounting a non-existent secret when certManager is
                   disabled crashes the pod; the operator also skips webhook wiring without a cert. */}}
            {{- if .Values.webhook.certManager.enabled }}
            - name: webhook-certs
              mountPath: /tmp/k8s-webhook-server/serving-certs
              readOnly: true
            {{- end }}
            {{- if .Values.operator.tls.agentClient.enabled }}
            # ADR-SEC-A §2.1 (C-330/N-340) + ADR-SEC-B §2.1: the operator mTLS client cert. The
            # operator REFUSES to dial agents without it (fail-closed), and ADR-SEC-B uses this
            # same private key to SIGN the checkpoint manifest (no second secret).
            - name: operator-agent-client-tls
              mountPath: /etc/podmotion/tls
              readOnly: true
            {{- end }}
      volumes:
        {{- /* ADR-0222 (3h-SYM): symmetric with the volumeMount above. */}}
        {{- if .Values.webhook.certManager.enabled }}
        - name: webhook-certs
          secret:
            secretName: podmotion-webhook-tls
        {{- end }}
        {{- if .Values.operator.tls.agentClient.enabled }}
        - name: operator-agent-client-tls
          secret:
            secretName: {{ .Values.operator.tls.agentClient.secretName }}
            # 0440 (group-readable) + pod fsGroup 65532 so the non-root operator can read
            # the cert. 0400 here is unreadable to UID 65532 even with fsGroup. Sprint 34.
            defaultMode: 0440
        {{- end }}
