apiVersion: v1
kind: Service
metadata:
  name: podmotion-demo-web
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: podmotion-demo
    app.kubernetes.io/component: web
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  type: ClusterIP
  selector:
    app: podmotion-demo-web
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
