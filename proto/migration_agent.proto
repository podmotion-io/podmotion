syntax = "proto3";

package podmotion.agent.v1;
option go_package = "github.com/podmotion-io/podmotion/proto/gen;agentpb";

// MigrationAgentService is implemented by the podmotion-agent DaemonSet on each node.
service MigrationAgentService {
  // PrepareSource validates the source pod is migratable and begins pre-copy if mode=PreCopy.
  rpc PrepareSource(PrepareSourceRequest) returns (PrepareSourceResponse);
  // PreDumpRound executes one iterative pre-dump round and returns dirty page stats.
  rpc PreDumpRound(PreDumpRoundRequest) returns (PreDumpRoundResponse);
  // Checkpoint performs the final freeze and CRIU dump.
  rpc Checkpoint(CheckpointRequest) returns (CheckpointResponse);
  // PrepareDestination pre-allocates pod netns, IP address, and storage on the destination node.
  rpc PrepareDestination(PrepareDestinationRequest) returns (PrepareDestinationResponse);
  // Restore performs CRIU restore on the destination node.
  rpc Restore(RestoreRequest) returns (RestoreResponse);
  // Verify confirms the restored pod is healthy and accepting traffic.
  rpc Verify(VerifyRequest) returns (VerifyResponse);
  // PrepareDestinationNetns pre-stages the migration network namespace on the destination
  // node and returns the file descriptor path and VTEP MAC for overlay FDB injection.
  rpc PrepareDestinationNetns(PrepareDestinationNetnsRequest) returns (PrepareDestinationNetnsResponse);
  // ConfirmOverlayReady evaluates the ADR-0049 atomicity barrier predicates B–F on the
  // destination node and returns the result. The controller calls this RPC after Restore
  // succeeds and before calling DisarmZeroWindow on the source node.
  // Predicate A (tcpi_unacked==0) is checked by ArmZeroWindow on the source node.
  rpc ConfirmOverlayReady(ConfirmOverlayReadyRequest) returns (ConfirmOverlayReadyResponse);
  // ArmZeroWindow attaches the zero_window eBPF program to the source pod veth TC egress,
  // causing the kernel to advertise win=0 on all outgoing ACKs, stalling the peer sender.
  // Must be called before FinalFreeze. The agent arms a watchdog that auto-disarms after
  // FreezeWindowBudgetMs + margin if DisarmZeroWindow is not received in time.
  rpc ArmZeroWindow(ArmZeroWindowRequest) returns (ArmZeroWindowResponse);
  // DisarmZeroWindow detaches the zero_window eBPF program from the source pod veth,
  // allowing the peer sender to resume. Must be called after CRIU restore is confirmed
  // complete and all 6 ADR-0049 barrier predicates are satisfied.
  rpc DisarmZeroWindow(DisarmZeroWindowRequest) returns (DisarmZeroWindowResponse);
  // Abort cancels an in-progress migration and triggers rollback.
  rpc Abort(AbortRequest) returns (AbortResponse);
  // EstimateCheckpoint performs a 10-second dirty page sampling without checkpointing.
  rpc EstimateCheckpoint(EstimateCheckpointRequest) returns (EstimateCheckpointResponse);
  // PutCheckpointTar receives a tar archive of checkpoint image files from the operator
  // and extracts them into the migration checkpoint directory on the destination node.
  // Used for same-cluster (LAN) cold migration where the operator can read source
  // checkpoint files directly and push them to the destination agent.
  rpc PutCheckpointTar(PutCheckpointTarRequest) returns (PutCheckpointTarResponse);
  // GetCheckpointTar reads the checkpoint image directory on the source agent and
  // returns a gzip-compressed tar of all files. This is a pure read — it does NOT
  // zeroize the source. The controller calls this, then PutCheckpointTar, then persists
  // CheckpointTransferred=true, then calls ReleaseCheckpoint to destroy the source copy.
  rpc GetCheckpointTar(GetCheckpointTarRequest) returns (GetCheckpointTarResponse);
  // ReleaseCheckpoint zeroizes and removes the checkpoint directory on this (source) node.
  // Called by the controller only after PutCheckpointTar has succeeded AND
  // pm.Status.CheckpointTransferred has been durably persisted. Idempotent: returns
  // success if the directory is already absent (handles controller-restart replay).
  rpc ReleaseCheckpoint(ReleaseCheckpointRequest) returns (ReleaseCheckpointResponse);
  // InjectIPHandoff installs neighbor/FDB entries on the DESTINATION node so the OLD
  // pod IP becomes reachable at the replacement pod's veth MAC (ADR-0133 Decision 2).
  // Called by the controller in reconcileVerifying after criuRestoreConfirmed=true and
  // before DisarmZeroWindow. Idempotent (RTM_NEWNEIGH NLM_F_REPLACE). The response
  // returns the destination node's VTEP MAC and an in-node reachability probe result.
  rpc InjectIPHandoff(InjectIPHandoffRequest) returns (InjectIPHandoffResponse);
  // CleanupSourceIPHandoff removes the stale ARP/neighbor and FDB entries for the OLD
  // pod IP on the SOURCE node after traffic has moved to the replacement (ADR-0133
  // Decision 4). Deferred until after TrafficVerified=True and DisarmZeroWindow.
  // Idempotent: ENOENT is treated as success.
  rpc CleanupSourceIPHandoff(CleanupSourceIPHandoffRequest) returns (CleanupSourceIPHandoffResponse);
  // InjectSourceRedirect installs the SOURCE-node VXLAN redirect for the OLD pod IP
  // (ADR-0136). Because the OLD IP is in the source node's own pod CIDR, the kernel
  // otherwise routes it to the dead local cni0 bridge. This installs three consistent
  // entries on flannel.1 — a /32 route, an AF_INET neigh (oldIP->replVethMAC) and an
  // AF_BRIDGE FDB (replVethMAC->destNodeIP) — so traffic is VXLAN-encapsulated to the
  // destination VTEP instead. Called from injectIPHandoff after the destination probe
  // passes; torn down by CleanupSourceIPHandoff after TrafficVerified=True. Idempotent.
  rpc InjectSourceRedirect(InjectSourceRedirectRequest) returns (InjectSourceRedirectResponse);
  // DisarmTCRedirect removes the ADR-0139 tc-ingress redirect (filter + ingress qdisc) from
  // the destination overlay interface (flannel.1) after TrafficVerified=True (Decision 3
  // disarm order). Idempotent: ENOENT is treated as success.
  rpc DisarmTCRedirect(DisarmTCRedirectRequest) returns (DisarmTCRedirectResponse);
  // VerifyTCP reads /proc/<pid>/net/tcp[6] on the destination node post-restore and
  // compares each ESTABLISHED 4-tuple's snd_nxt/rcv_nxt against the source SeqSnapshots
  // captured at freeze. Returns verified=true only when all connections match within
  // ±MSS (1448 bytes). Also issues the ApplicationProbe (SQL/TCP) when configured.
  // Called by the controller during TCPVerifying phase per ADR-0019 Amendment A.
  rpc VerifyTCP(VerifyTCPRequest) returns (VerifyTCPResponse);
}

message PrepareSourceRequest {
  string pod_name       = 1;
  string pod_namespace  = 2;
  string pod_uid        = 3;
  string migration_name = 4;
  MigrationMode mode    = 5;
}
message PrepareSourceResponse {
  bool   compatible          = 1;
  string blocking_reason     = 2; // set if compatible=false
  int32  storage_tier        = 3;
  bool   cni_ip_mobile       = 4;
  int32  tcp_connection_count = 5;
}

message PreDumpRoundRequest {
  string migration_name = 1;
  int32  round_number   = 2;
  string pod_uid        = 3; // used to resolve the container root PID via cgroup walk
}
message PreDumpRoundResponse {
  int64 dirty_pages_mb       = 1;
  int64 round_duration_ms    = 2;
  bool  threshold_reached    = 3;
}

message CheckpointRequest {
  string migration_name        = 1;
  reserved 2;
  reserved "tcp_established";
  bool   apply_zero_window     = 3; // engage eBPF zero-window hold before freeze
  string workload_namespace    = 4; // namespace of the migrating pod's PodMigration CR (not operator ns)
}
message CheckpointResponse {
  int64  freeze_duration_ms    = 1;
  string checkpoint_sha256     = 2;
  int64  checkpoint_size_bytes = 3;
  // seq_snapshots holds the TCP sequence state for every ESTABLISHED socket
  // in the container netns at the exact freeze instant (ADR-0049).
  // Populated when TCPPreservationMode is Strict or BestEffort.
  repeated SeqSnapshot seq_snapshots = 4;
  // freeze_timestamp_ns is CLOCK_REALTIME nanoseconds captured at the exact
  // moment the CRIU dump completes and the process enters SIGSTOP.
  // The controller passes this as source_freeze_timestamp_ns in RestoreRequest
  // so the destination agent can compute the PAWS ts_delta.
  int64  freeze_timestamp_ns   = 5;
}

// SeqSnapshot captures TCP sequence state for a single connection at freeze time.
// Used to verify sequence continuity after restore (ADR-0049).
message SeqSnapshot {
  string src_ip   = 1; // source IP of the 4-tuple
  uint32 src_port = 2;
  string dst_ip   = 3; // destination IP of the 4-tuple
  uint32 dst_port = 4;
  uint32 snd_nxt  = 5; // TCP SND.NXT at freeze
  uint32 rcv_nxt  = 6; // TCP RCV.NXT at freeze
  uint32 ts_recent = 7; // TSecr / ts_recent for PAWS
}

message PrepareDestinationRequest {
  string migration_name      = 1;
  string source_node         = 2;
  string pod_ip              = 3;
  string pod_namespace       = 4;
  int32  storage_tier        = 5;
}
message PrepareDestinationResponse {
  bool   ready               = 1;
  string blocking_reason     = 2;
  bool   ip_reserved         = 3;
  bool   storage_ready       = 4;
}

message PrepareDestinationNetnsRequest {
  string migration_name = 1;
  string pod_ip         = 2; // IP to assign in the pre-staged netns
  string pod_namespace  = 3;
  // workload_image is the OCI image reference of the source pod's primary
  // container (pod.Spec.Containers[0].Image), mirrored from the MigrationCheckpoint
  // CR's MigrationCheckpointSpec.WorkloadImage. The destination agent caches it so
  // the gRPC Restore fallback path (no NRI containerID) can start the placeholder
  // container with the SAME image as the checkpointed workload, matching CRIU's
  // mapped-VMA file sizes. ADR-0168 B2.
  // Optional. Default empty string ("") — when empty, the agent falls back to its
  // last-resort hardcoded default in joinNsRestore.
  optional string workload_image = 14;
}
message PrepareDestinationNetnsResponse {
  bool   ready          = 1;
  string blocking_reason = 2;
  string dest_netns_fd  = 3; // /proc/<pid>/fd/<n> path to the pre-staged netns
  string dest_vtep_mac  = 4; // VTEP MAC for overlay FDB injection (ADR-0048)
}

message RestoreRequest {
  string migration_name              = 1;
  string checkpoint_ref              = 2; // OCI image ref or direct P2P staging path
  string source_node_addr            = 3; // for DirectP2P mode
  reserved 4;
  reserved "network_continuity";
  string dest_netns_fd               = 5; // pre-staged netns path from PrepareDestinationNetns
  int64  source_freeze_timestamp_ns  = 6; // CLOCK_REALTIME ns at source freeze for seq-xlat
  // seq_snapshots carries per-connection TCP sequence state from the source freeze instant
  // so the destination can seed PM_SEQ_XLAT before ZeroWindowDisarm (ADR-0049 predicate B).
  // Populated by the controller from CheckpointResponse.seq_snapshots.
  repeated SeqSnapshot seq_snapshots = 7;
  // relay_ifname is the overlay interface name on the destination where PM_RELAY_TC programs
  // are attached (typically "flannel.1"). Empty means use the default "flannel.1".
  string relay_ifname                = 8;
  // tcp_preservation_mode mirrors spec.tcpPreservationMode ("None"|"BestEffort"|"Strict").
  // Required for ADR-0049 Amendment D A1 fail-closed enforcement: patchCheckpointImages
  // failure is a hard abort when mode=="Strict" (explicit field replaces the SeqSnapshots>0
  // proxy, closing the narrow fail-open where Strict with zero TCP connections would degrade).
  string tcp_preservation_mode       = 9;
}
message RestoreResponse {
  bool   success           = 1;
  string error_message     = 2;
  int64  restore_duration_ms = 3;
}

message VerifyRequest {
  string migration_name = 1;
  string pod_name       = 2;
  string pod_namespace  = 3;
}
message VerifyResponse {
  bool   healthy              = 1;
  int32  tcp_connections_live = 2;
  string failure_reason       = 3;
}

message AbortRequest {
  string migration_name = 1;
  string reason         = 2;
}
message AbortResponse {
  bool success = 1;
}

message EstimateCheckpointRequest {
  string pod_name      = 1;
  string pod_namespace = 2;
  int32  sample_secs   = 3; // default 10
}
message EstimateCheckpointResponse {
  float  dirty_page_rate_mb_per_sec    = 1;
  int64  estimated_freeze_duration_ms  = 2;
  int64  estimated_checkpoint_size_mb  = 3;
  int32  storage_tier                  = 4;
  bool   migratable                    = 5;
  string blocking_reason               = 6;
}

message PutCheckpointTarRequest {
  string migration_name = 1; // used to determine destination directory
  bytes  tar_data       = 2; // gzip-compressed tar of the checkpoint final/ directory
}
message PutCheckpointTarResponse {
  bool   success      = 1;
  string error        = 2;
  int64  bytes_written = 3;
}

message GetCheckpointTarRequest {
  string migration_name = 1; // identifies the checkpoint directory on the source node
}
message GetCheckpointTarResponse {
  bool   success      = 1;
  string error        = 2;
  bytes  tar_data     = 3; // gzip-compressed tar of the checkpoint final/ directory
  int64  bytes_read   = 4;
}

message ReleaseCheckpointRequest {
  string migration_name      = 1;
  string migration_namespace = 2;
}
message ReleaseCheckpointResponse {
  bool   success = 1;
  string error   = 2;
}

// ConfirmOverlayReadyRequest carries the barrier predicate inputs from the controller.
// The destination agent evaluates predicates B–F locally and returns the result.
message ConfirmOverlayReadyRequest {
  string migration_name           = 1;
  // seq_xlat_seeded must be set to true by the controller after SeedRelayFromSnapshots
  // has populated PM_SEQ_XLAT (predicate B). Empty snapshot list → B is trivially satisfied.
  bool   seq_xlat_seeded          = 2;
  // fdb_ifname is the overlay interface name (e.g. "flannel.1") for RTM_GETNEIGH confirmation.
  string fdb_ifname               = 3;
  // pod_ip is the source pod IP used to look up AF_INET FDB entries.
  string pod_ip                   = 4;
  // pod_mac is the source pod MAC used to look up AF_BRIDGE FDB entries.
  string pod_mac                  = 5;
  // vtep_ip is the destination VTEP IP used in the AF_BRIDGE entry lookup.
  string vtep_ip                  = 6;
  // source_conntrack_armed indicates that the NOTRACK rule is confirmed on the source node.
  bool   source_conntrack_armed   = 7;
  // restore_complete indicates that CRIU restore has succeeded (predicate F).
  bool   restore_complete         = 8;
  // source_clock_ns is CLOCK_MONOTONIC ns captured on the source node at freeze time.
  // Used with dest_clock_ns to compute PAWS ts_delta (RFC 7323 §5.3).
  int64  source_clock_ns          = 9;
  // pre_restore selects the barrier mode. When true (OverlayHandoff phase, before CRIU
  // restore) the source-side conntrack arm check in predicate E and predicate F
  // (restore_complete) are deferred; only B/C/D and dest-side conntrack must hold so the
  // handoff can proceed to restore. When false (DisengageHold, post-restore) all six
  // predicates are enforced. See ADR-0049 / Sprint 32 gate20.
  bool   pre_restore              = 10;
}

message ConfirmOverlayReadyResponse {
  // ready is true when all evaluated predicates pass.
  bool   ready             = 1;
  // blocking_reason lists which predicates failed; empty when ready=true.
  string blocking_reason   = 2;
  // predicate_b_ok: PM_SEQ_XLAT seeded.
  bool   predicate_b_ok    = 3;
  // predicate_c_ok: AF_BRIDGE FDB confirmed.
  bool   predicate_c_ok    = 4;
  // predicate_d_ok: AF_INET FDB confirmed.
  bool   predicate_d_ok    = 5;
  // predicate_e_ok: conntrack NOTRACK armed on both nodes.
  bool   predicate_e_ok    = 6;
  // predicate_f_ok: CRIU restore complete.
  bool   predicate_f_ok    = 7;
  // ts_delta is the PAWS clock offset (ms) computed on the destination node.
  // Seeded into PM_SEQ_XLAT ts_delta field before relay arms.
  int32  ts_delta          = 8;
  // dest_clock_ns is CLOCK_MONOTONIC ns captured on the destination at confirm time.
  int64  dest_clock_ns     = 9;
}

message ArmZeroWindowRequest {
  string migration_name         = 1;
  string pod_uid                = 2; // used to resolve the source pod veth ifindex
  int64  freeze_window_budget_ms = 3; // watchdog auto-disarm deadline from FreezeWindowBudgetMs
  // tcp_preservation_mode mirrors spec.tcpPreservationMode ("None"|"BestEffort"|"Strict").
  // Required for ADR-0049 Amendment D fail-closed enforcement: armZeroWindowBPF returns a
  // typed error (rather than nil) on arm failure or ifindex==0 when mode=="Strict".
  string tcp_preservation_mode  = 4;
}
message ArmZeroWindowResponse {
  bool   armed          = 1;
  string blocking_reason = 2; // set if armed=false
  int64  armed_at_ns    = 3; // CLOCK_REALTIME ns when TC filter was attached
}

message DisarmZeroWindowRequest {
  string migration_name = 1;
  string pod_uid        = 2;
}
message DisarmZeroWindowResponse {
  bool   disarmed        = 1;
  string blocking_reason = 2; // set if disarmed=false
  int64  disarmed_at_ns  = 3; // CLOCK_REALTIME ns when TC filter was detached
  int64  hold_duration_ms = 4; // wall time from arm to disarm
}

// InjectIPHandoffRequest carries the inputs for the ADR-0133 D2 destination-side
// neighbor/FDB injection. All inputs are node-internal (no attacker-supplied data).
message InjectIPHandoffRequest {
  string migration_name   = 1;
  // old_pod_ip is the source pod's original IP (pm.Spec.SourcePodIP) that must become
  // reachable at the replacement pod on this (destination) node.
  string old_pod_ip       = 2;
  // repl_veth_mac is the replacement pod's eth0 MAC inside the pod netns, collected by
  // the NRI plugin at restore time and threaded through ReportRestoreConfirmed → CR status.
  string repl_veth_mac    = 3;
  // src_node_vtep_mac is the source node's flannel.1 VTEP MAC (for diagnostics / FDB).
  string src_node_vtep_mac = 4;
  // fdb_ifname is the overlay interface name (default "flannel.1").
  string fdb_ifname       = 5;
  // bridge_ifname is the local CNI bridge name (default "cni0").
  string bridge_ifname    = 6;
  // probe indicates the agent should run an in-node ICMP reachability probe to old_pod_ip
  // after installing the entries (ADR-0133 Decision 5).
  bool   probe            = 7;
}
message InjectIPHandoffResponse {
  bool   injected         = 1;
  string blocking_reason  = 2;
  // dest_vtep_mac is this node's VTEP MAC, returned so the operator can pass it
  // to the source agent for FDB cleanup (ADR-0133 Decision 3/4).
  string dest_vtep_mac    = 3;
  // probe_ok is the result of the in-node `ping -c1 -W2 old_pod_ip` reachability probe.
  bool   probe_ok         = 4;
  string probe_output     = 5;
  // resolved_fdb_if is the FDB overlay device resolved by the agent (ADR-0192 VERIFY-11).
  // Set to the interface name when a VXLAN device was found, or "none:substrate-not-applicable"
  // when the substrate has no VXLAN overlay (kind/kindnet). Empty string means resolution
  // was not attempted (legacy path) or operator supplied an explicit fdb_ifname override.
  string resolved_fdb_if  = 6;
}

// CleanupSourceIPHandoffRequest carries the inputs for ADR-0133 D4 source-side cleanup.
message CleanupSourceIPHandoffRequest {
  string migration_name   = 1;
  // old_pod_ip is the source pod IP whose stale neighbor/FDB entries are to be removed.
  string old_pod_ip       = 2;
  // fdb_ifname is the overlay interface name (default "flannel.1").
  string fdb_ifname       = 3;
  // bridge_ifname is the local CNI bridge name (default "cni0").
  string bridge_ifname    = 4;
}
message CleanupSourceIPHandoffResponse {
  bool   cleaned          = 1;
  string blocking_reason  = 2;
}

// DisarmTCRedirectRequest carries the inputs for ADR-0139 Decision 3 tc-redirect teardown.
message DisarmTCRedirectRequest {
  string migration_name   = 1;
  // fdb_ifname is the overlay interface the redirect was installed on (default "flannel.1").
  string fdb_ifname       = 2;
  // old_pod_ip is the relocated OLD pod IP whose ADR-0140 FORWARD ACCEPT pair is also removed.
  string old_pod_ip       = 3;
}
message DisarmTCRedirectResponse {
  bool   disarmed         = 1;
  string blocking_reason  = 2;
}

// InjectSourceRedirectRequest carries the inputs for the ADR-0136 source-node VXLAN
// redirect. All inputs are node-internal / control-plane sourced (no attacker data).
message InjectSourceRedirectRequest {
  string migration_name   = 1;
  // old_pod_ip is the relocated source pod IP that must be redirected over the overlay.
  string old_pod_ip       = 2;
  // repl_veth_mac is the replacement pod's eth0 MAC (the MAC the L3 neigh resolves to;
  // the AF_BRIDGE FDB is keyed on THIS MAC, not the destination VTEP MAC — ADR-0136).
  string repl_veth_mac    = 3;
  // dst_node_ip is the destination node's underlay (VTEP tunnel endpoint) IP, used as the
  // AF_BRIDGE FDB destination so the VXLAN driver encapsulates frames to that node.
  string dst_node_ip      = 4;
  // fdb_ifname is the overlay interface name (default "flannel.1").
  string fdb_ifname       = 5;
}
message InjectSourceRedirectResponse {
  bool   injected         = 1;
  string blocking_reason  = 2;
}

enum MigrationMode {
  MIGRATION_MODE_UNSPECIFIED = 0;
  MIGRATION_MODE_PRE_COPY    = 1;
  MIGRATION_MODE_POST_COPY   = 2;
  MIGRATION_MODE_COLD        = 3;
}

// VerifyTCPRequest asks the destination agent to read /proc/<pid>/net/tcp[6]
// and compare 4-tuples + snd_nxt/rcv_nxt against source_seq_snapshots.
message VerifyTCPRequest {
  string migration_name          = 1;
  string pod_uid                 = 2;
  repeated SeqSnapshot source_seq_snapshots = 3;
  // app_probe_protocol selects the optional SQL/TCP probe: "SQL", "TCP", or "".
  string app_probe_protocol      = 4;
  string app_probe_address       = 5; // host:port for TCP/SQL probe
  string app_probe_query         = 6; // SQL query (e.g. "SELECT 1")
  int32  app_probe_timeout_s     = 7;
}

message VerifyTCPResponse {
  bool   verified              = 1;
  string failure_reason        = 2;
  int32  connections_verified  = 3;
  int32  connections_expected  = 4;
  bool   app_probe_ok          = 5;
  string app_probe_error       = 6;
}
