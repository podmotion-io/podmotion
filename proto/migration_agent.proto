syntax = "proto3";

package podmotion.agent.v1;
option go_package = "github.com/podmotion-io/podmotion/proto/gen;agentpb";

// MigrationAgentService is implemented by the podmotion-agent DaemonSet on each node.
service MigrationAgentService {
  // PrepareSource validates the source pod is migratable and begins pre-copy if mode=PreCopy.
  rpc PrepareSource(PrepareSourceRequest) returns (PrepareSourceResponse);
  // PreDumpRound executes one iterative pre-dump round and returns dirty page stats.
  rpc PreDumpRound(PreDumpRoundRequest) returns (PreDumpRoundResponse);
  // Checkpoint performs the final freeze and CRIU dump.
  rpc Checkpoint(CheckpointRequest) returns (CheckpointResponse);
  // PrepareDestination pre-allocates pod netns, IP address, and storage on the destination node.
  rpc PrepareDestination(PrepareDestinationRequest) returns (PrepareDestinationResponse);
  // Restore performs CRIU restore on the destination node.
  rpc Restore(RestoreRequest) returns (RestoreResponse);
  // Verify confirms the restored pod is healthy and accepting traffic.
  rpc Verify(VerifyRequest) returns (VerifyResponse);
  // Abort cancels an in-progress migration and triggers rollback.
  rpc Abort(AbortRequest) returns (AbortResponse);
  // EstimateCheckpoint performs a 10-second dirty page sampling without checkpointing.
  rpc EstimateCheckpoint(EstimateCheckpointRequest) returns (EstimateCheckpointResponse);
  // PutCheckpointTar receives a tar archive of checkpoint image files from the operator
  // and extracts them into the migration checkpoint directory on the destination node.
  // Used for same-cluster (LAN) cold migration where the operator can read source
  // checkpoint files directly and push them to the destination agent.
  rpc PutCheckpointTar(PutCheckpointTarRequest) returns (PutCheckpointTarResponse);
}

message PrepareSourceRequest {
  string pod_name       = 1;
  string pod_namespace  = 2;
  string pod_uid        = 3;
  string migration_name = 4;
  MigrationMode mode    = 5;
}
message PrepareSourceResponse {
  bool   compatible          = 1;
  string blocking_reason     = 2; // set if compatible=false
  int32  storage_tier        = 3;
  bool   cni_ip_mobile       = 4;
  int32  tcp_connection_count = 5;
}

message PreDumpRoundRequest {
  string migration_name = 1;
  int32  round_number   = 2;
}
message PreDumpRoundResponse {
  int64 dirty_pages_mb       = 1;
  int64 round_duration_ms    = 2;
  bool  threshold_reached    = 3;
}

message CheckpointRequest {
  string migration_name        = 1;
  bool   tcp_established       = 2;
  bool   apply_zero_window     = 3; // engage eBPF zero-window hold before freeze
}
message CheckpointResponse {
  int64  freeze_duration_ms   = 1;
  string checkpoint_sha256    = 2;
  int64  checkpoint_size_bytes = 3;
}

message PrepareDestinationRequest {
  string migration_name      = 1;
  string source_node         = 2;
  string pod_ip              = 3;
  string pod_namespace       = 4;
  int32  storage_tier        = 5;
}
message PrepareDestinationResponse {
  bool   ready               = 1;
  string blocking_reason     = 2;
  bool   ip_reserved         = 3;
  bool   storage_ready       = 4;
}

message RestoreRequest {
  string migration_name    = 1;
  string checkpoint_ref    = 2; // OCI image ref or direct P2P staging path
  string source_node_addr  = 3; // for DirectP2P mode
  bool   network_continuity = 4;
}
message RestoreResponse {
  bool   success           = 1;
  string error_message     = 2;
  int64  restore_duration_ms = 3;
}

message VerifyRequest {
  string migration_name = 1;
  string pod_name       = 2;
  string pod_namespace  = 3;
}
message VerifyResponse {
  bool   healthy              = 1;
  int32  tcp_connections_live = 2;
  string failure_reason       = 3;
}

message AbortRequest {
  string migration_name = 1;
  string reason         = 2;
}
message AbortResponse {
  bool success = 1;
}

message EstimateCheckpointRequest {
  string pod_name      = 1;
  string pod_namespace = 2;
  int32  sample_secs   = 3; // default 10
}
message EstimateCheckpointResponse {
  float  dirty_page_rate_mb_per_sec    = 1;
  int64  estimated_freeze_duration_ms  = 2;
  int64  estimated_checkpoint_size_mb  = 3;
  int32  storage_tier                  = 4;
  bool   migratable                    = 5;
  string blocking_reason               = 6;
}

message PutCheckpointTarRequest {
  string migration_name = 1; // used to determine destination directory
  bytes  tar_data       = 2; // gzip-compressed tar of the checkpoint final/ directory
}
message PutCheckpointTarResponse {
  bool   success      = 1;
  string error        = 2;
  int64  bytes_written = 3;
}

enum MigrationMode {
  MIGRATION_MODE_UNSPECIFIED = 0;
  MIGRATION_MODE_PRE_COPY    = 1;
  MIGRATION_MODE_POST_COPY   = 2;
  MIGRATION_MODE_COLD        = 3;
}
