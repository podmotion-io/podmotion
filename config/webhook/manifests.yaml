---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: podmotion-validating-webhook-configuration
  annotations:
    # cert-manager injects the CA bundle into this annotation.
    cert-manager.io/inject-ca-from: podmotion-system/podmotion-serving-cert
webhooks:
  - name: vpodmigration.podmotion.io
    admissionReviewVersions: ["v1"]
    clientConfig:
      service:
        name: podmotion-webhook-service
        namespace: podmotion-system
        path: /validate-podmotion-io-v1alpha1-podmigration
    failurePolicy: Fail
    rules:
      - apiGroups: ["migration.podmotion.io"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["podmigrations"]
    sideEffects: None
---
# Eviction interception: blocks pod evictions while a PodMigration is active for that pod.
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: podmotion-eviction-webhook-configuration
  annotations:
    cert-manager.io/inject-ca-from: podmotion-system/podmotion-serving-cert
webhooks:
  - name: meviction.podmotion.io
    admissionReviewVersions: ["v1"]
    clientConfig:
      service:
        name: podmotion-webhook-service
        namespace: podmotion-system
        path: /mutate-core-v1-pod-eviction
    # ADR-0401: fail CLOSED. When the webhook is unreachable/times out, the apiserver must
    # DENY the eviction (protecting a possible in-flight migration source), not admit it.
    # The blast radius of Fail is bounded by the namespaceSelector exclusion below (the
    # operator/system namespaces stay evictable so cluster self-healing is never wedged) and
    # timeoutSeconds. A denied eviction is retriable (handler returns 429).
    failurePolicy: Fail
    timeoutSeconds: 5
    # Load-bearing anti-self-deadlock valve: never let a webhook outage block eviction of the
    # operator's own pods or core system pods (they are never PodMotion migration sources).
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - podmotion-system
            - kube-system
            - kube-node-lease
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods/eviction"]
    sideEffects: None
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: podmotion-mutating-webhook-configuration
  annotations:
    cert-manager.io/inject-ca-from: podmotion-system/podmotion-serving-cert
webhooks:
  - name: mpodmigration.podmotion.io
    admissionReviewVersions: ["v1"]
    clientConfig:
      service:
        name: podmotion-webhook-service
        namespace: podmotion-system
        path: /mutate-podmotion-io-v1alpha1-podmigration
    failurePolicy: Fail
    rules:
      - apiGroups: ["migration.podmotion.io"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE"]
        resources: ["podmigrations"]
    sideEffects: None
