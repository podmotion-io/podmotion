# Example PodMigration CR — replace podName/podNamespace with your target pod
apiVersion: podmotion.io/v1alpha1
kind: PodMigration
metadata:
  name: example-migration
spec:
  podName: my-pod
  podNamespace: default
  # targetNodeName: worker-node-2  # optional: omit to let the scheduler plugin select
  tcpPreservationMode: None         # None (stateless) | BestEffort | Strict (TCP-preserving)
