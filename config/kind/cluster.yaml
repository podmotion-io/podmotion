kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: podmotion
nodes:
- role: control-plane
  image: podmotion-node:dev
- role: worker
  image: podmotion-node:dev
  labels:
    podmotion.io/migration-capable: "true"
  extraMounts:
  - hostPath: /tmp/podmotion-checkpoints
    containerPath: /var/lib/podmotion/checkpoints
    readOnly: false
- role: worker
  image: podmotion-node:dev
  labels:
    podmotion.io/migration-capable: "true"
  extraMounts:
  - hostPath: /tmp/podmotion-checkpoints
    containerPath: /var/lib/podmotion/checkpoints
    readOnly: false
