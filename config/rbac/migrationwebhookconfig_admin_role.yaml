# This rule is not used by the project podmotion itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over migration.podmotion.io.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: podmotion
    app.kubernetes.io/managed-by: kustomize
  name: migrationwebhookconfig-admin-role
rules:
- apiGroups:
  - migration.podmotion.io
  resources:
  - migrationwebhookconfigs
  verbs:
  - '*'
- apiGroups:
  - migration.podmotion.io
  resources:
  - migrationwebhookconfigs/status
  verbs:
  - get
