---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - nodes
  verbs:
  - get
  - list
  - patch
  - watch
- apiGroups:
  - ""
  resources:
  - persistentvolumeclaims
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - delete
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - pods/status
  verbs:
  - get
- apiGroups:
  - apps
  resources:
  - statefulsets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - discovery.k8s.io
  resources:
  - endpointslices
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - migration.podmotion.io
  resources:
  - migrationcheckpoints
  - migrationpolicies
  - migrationwebhookconfigs
  - nodemigrationcapacities
  - podmigrations
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - migration.podmotion.io
  resources:
  - migrationcheckpoints/finalizers
  - migrationpolicies/finalizers
  - migrationwebhookconfigs/finalizers
  - nodemigrationcapacities/finalizers
  - podmigrations/finalizers
  verbs:
  - update
- apiGroups:
  - migration.podmotion.io
  resources:
  - migrationcheckpoints/status
  - migrationpolicies/status
  - migrationwebhookconfigs/status
  - nodemigrationcapacities/status
  - podmigrations/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - policy
  resources:
  - poddisruptionbudgets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
