# This rule is not used by the project podmotion itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to migration.podmotion.io resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: podmotion
    app.kubernetes.io/managed-by: kustomize
  name: migrationcheckpoint-viewer-role
rules:
- apiGroups:
  - migration.podmotion.io
  resources:
  - migrationcheckpoints
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - migration.podmotion.io
  resources:
  - migrationcheckpoints/status
  verbs:
  - get
