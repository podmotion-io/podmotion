---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: nodemigrationcapacities.migration.podmotion.io
spec:
  group: migration.podmotion.io
  names:
    categories:
    - podmotion
    kind: NodeMigrationCapacity
    listKind: NodeMigrationCapacityList
    plural: nodemigrationcapacities
    shortNames:
    - nmc
    singular: nodemigrationcapacity
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.nodeName
      name: Node
      type: string
    - jsonPath: .spec.criuVersion
      name: CRIU
      type: string
    - jsonPath: .spec.networkCapability.ipMobilitySupported
      name: IPMobility
      type: boolean
    - jsonPath: .status.ready
      name: Ready
      type: boolean
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          NodeMigrationCapacity is a cluster-scoped record advertising a node's migration capabilities.
          One record per node, named after the node. Created and maintained by the podmotion-agent DaemonSet.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: NodeMigrationCapacitySpec is set by the node agent at startup
              and updated periodically.
            properties:
              agentEndpoint:
                description: |-
                  AgentEndpoint is the gRPC endpoint of the agent on this node, in the form "ip:port".
                  Set by the agent at startup so that the operator can reach systemd-based agents that
                  do not run as Kubernetes pods and therefore have no pod IP discoverable via label selector.
                type: string
              criuVersion:
                description: CRIUVersion is the version of CRIU installed on the node
                  (e.g. "4.2").
                type: string
              gpuDriverVersion:
                description: GPUDriverVersion is the NVIDIA driver version if GPU
                  migration is supported.
                type: string
              gpuMigrationSupported:
                description: GPUMigrationSupported indicates NVIDIA cuda-checkpoint
                  is available.
                type: boolean
              kernelFeatures:
                description: KernelFeatures describes kernel capability flags verified
                  at agent startup.
                properties:
                  bpfEnabled:
                    description: BPFEnabled indicates CONFIG_BPF_SYSCALL is enabled
                      (required for eBPF packet bridge).
                    type: boolean
                  checkpointRestore:
                    description: CheckpointRestore indicates CONFIG_CHECKPOINT_RESTORE
                      is enabled.
                    type: boolean
                  kernelVersion:
                    description: KernelVersion is the full kernel version string reported
                      by uname -r.
                    type: string
                  memSoftDirty:
                    description: MemSoftDirty indicates CONFIG_MEM_SOFT_DIRTY is enabled
                      (required for iterative pre-copy).
                    type: boolean
                  tcClsactSupported:
                    description: |-
                      TCClsactSupported indicates the node can attach a clsact qdisc to a veth-class
                      interface (RTM_NEWQDISC for clsact returns success, not EOPNOTSUPP). Required for
                      tcpPreservationMode=Strict zero-window hold. Set by an ACTIVE runtime probe at
                      registration, NOT inferred from CONFIG_BPF_SYSCALL — BPFEnabled is not a reliable
                      proxy for clsact-on-veth support (ADR-0169).
                    type: boolean
                  userfaultfd:
                    description: Userfaultfd indicates CONFIG_USERFAULTFD is enabled
                      (required for post-copy lazy pages).
                    type: boolean
                  xdpSupported:
                    description: XDPSupported indicates XDP on veth is supported (kernel
                      4.19+).
                    type: boolean
                required:
                - bpfEnabled
                - checkpointRestore
                - kernelVersion
                - memSoftDirty
                - tcClsactSupported
                - userfaultfd
                - xdpSupported
                type: object
              maxConcurrentMigrationsDestination:
                default: 2
                description: MaxConcurrentMigrationsDestination is the maximum simultaneous
                  migrations this node can receive.
                format: int32
                type: integer
              maxConcurrentMigrationsSource:
                default: 2
                description: MaxConcurrentMigrationsSource is the maximum simultaneous
                  migrations this node can serve as source.
                format: int32
                type: integer
              networkCapability:
                description: NetworkCapability describes network continuity support.
                properties:
                  cniPlugin:
                    description: CNIPlugin is the detected primary CNI plugin (e.g.
                      ovn-kubernetes, calico, cilium, flannel).
                    type: string
                  cniUnderlayType:
                    description: |-
                      CNIUnderlayType captures the dataplane encapsulation type (e.g. VXLAN, Direct,
                      WireGuard, BGP). Used for MSS clamping calculations when GENEVE bridge is active.
                    type: string
                  ipMobilityMode:
                    description: IPMobilityMode describes the mechanism (e.g. IPAMClaim,
                      BGPHostRoute, L2Announce).
                    type: string
                  ipMobilitySupported:
                    description: IPMobilitySupported indicates the CNI can preserve
                      pod IPs across node moves.
                    type: boolean
                  liveMigrationEligible:
                    default: true
                    description: |-
                      LiveMigrationEligible is false when the CNI does not support IP mobility
                      (e.g. Flannel). Pods on nodes where this is false can only use cold migration
                      (NetworkContinuity=false). Defaults to true for CNIs that support IPAM pinning.
                    type: boolean
                  wireGuardInterface:
                    description: |-
                      WireGuardInterface is the name of the WireGuard tunnel interface on this node's
                      primary CNI encryption path (e.g. "wireguard.cali", "cilium_wg0", "wg0").
                      Empty string if WireGuard is not in use (ADR-0102).
                    type: string
                  xdpBridgeCapable:
                    description: XDPBridgeCapable indicates the node can run the XDP
                      packet bridge program.
                    type: boolean
                required:
                - cniPlugin
                - ipMobilitySupported
                - liveMigrationEligible
                - xdpBridgeCapable
                type: object
              nodeName:
                description: NodeName is the Kubernetes node this capacity record
                  describes.
                type: string
              nriEnabled:
                description: NRIEnabled indicates containerd NRI is enabled on this
                  node.
                type: boolean
              storageCapability:
                description: StorageCapability describes supported storage migration
                  tiers.
                properties:
                  cephRBDAvailable:
                    description: CephRBDAvailable indicates the Ceph RBD live migration
                      API is reachable.
                    type: boolean
                  localPVMigratable:
                    description: LocalPVMigratable indicates pv-migrate rsync is available
                      for local PV migration.
                    type: boolean
                  longhornAvailable:
                    description: LonghornAvailable indicates Longhorn is deployed
                      and the node hosts engine replicas.
                    type: boolean
                required:
                - cephRBDAvailable
                - localPVMigratable
                - longhornAvailable
                type: object
            required:
            - criuVersion
            - kernelFeatures
            - networkCapability
            - nodeName
            - nriEnabled
            - storageCapability
            type: object
          status:
            properties:
              activeDestinationMigrations:
                description: ActiveDestinationMigrations is the number of migrations
                  currently targeting this node.
                format: int32
                type: integer
              activeSourceMigrations:
                description: ActiveSourceMigrations is the number of migrations currently
                  sourced from this node.
                format: int32
                type: integer
              clusterIPFamily:
                description: |-
                  ClusterIPFamily reports the IP address family support detected on this node's
                  primary interface. Used by the admission webhook to reject IPv6-primary migrations
                  (ADR-0081). Populated by the NMC probe on startup and on each resync.
                enum:
                - IPv4Only
                - IPv6Only
                - DualStack
                - Unknown
                type: string
              conditions:
                description: Conditions provides status conditions including CNICompatible
                  (ADR-0313).
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              ipSecEncryption:
                description: |-
                  IPSecEncryption is true when CNI-managed IPSec (XFRM pod-CIDR policies) is
                  detected on this node. Migrations are rejected at admission for IPSec clusters
                  (ADR-0102).
                type: boolean
              lastHeartbeat:
                description: LastHeartbeat is when the agent last updated this record.
                format: date-time
                type: string
              ready:
                description: Ready indicates the agent is running and all required
                  features are available.
                type: boolean
              thermalThrottlePercent:
                description: ThermalThrottlePercent is the current CPU thermal throttle
                  percentage (0 = no throttling).
                format: int32
                type: integer
            required:
            - activeDestinationMigrations
            - activeSourceMigrations
            - ready
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
