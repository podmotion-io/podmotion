---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: migrationcheckpoints.migration.podmotion.io
spec:
  group: migration.podmotion.io
  names:
    categories:
    - podmotion
    kind: MigrationCheckpoint
    listKind: MigrationCheckpointList
    plural: migrationcheckpoints
    shortNames:
    - mcp
    singular: migrationcheckpoint
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.podMigrationRef
      name: Migration
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.transferMode
      name: Transfer
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: MigrationCheckpoint holds metadata and lifecycle for a single
          checkpoint artifact.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: MigrationCheckpointSpec holds metadata about a checkpoint
              artifact.
            properties:
              contentSHA256:
                description: ContentSHA256 is the SHA256 digest of the checkpoint
                  archive for integrity verification.
                type: string
              encrypted:
                description: Encrypted indicates the checkpoint OCI layers are encrypted.
                type: boolean
              expiresAt:
                description: ExpiresAt is when this checkpoint should be garbage-collected.
                format: date-time
                type: string
              podMigrationRef:
                description: PodMigrationRef is the owning PodMigration.
                type: string
              registryRef:
                description: RegistryRef is the OCI image reference for registry-staged
                  checkpoints (e.g. registry.local/pm-checkpoint/pod-abc:latest).
                type: string
              sizeBytes:
                description: SizeBytes is the total checkpoint size in bytes.
                format: int64
                type: integer
              sourceNodeName:
                description: SourceNodeName is the node the checkpoint was taken on.
                type: string
              transferMode:
                default: DirectP2P
                description: TransferMode describes how the checkpoint artifact is
                  staged.
                enum:
                - DirectP2P
                - Registry
                type: string
              workloadImage:
                description: |-
                  WorkloadImage is the OCI image reference of the source pod's primary container
                  (pod.Spec.Containers[0].Image). The destination agent uses it to start the
                  restore placeholder container with the SAME image as the checkpointed workload,
                  so the placeholder rootfs binary sizes match the CRIU checkpoint's mapped VMAs
                  on the gRPC Restore fallback path (no NRI containerID). ADR-0168 B2.
                type: string
            required:
            - podMigrationRef
            - sourceNodeName
            type: object
          status:
            description: MigrationCheckpointStatus reflects the lifecycle of the checkpoint
              artifact.
            properties:
              capturedAt:
                description: CapturedAt is when the checkpoint was completed.
                format: date-time
                type: string
              conntrackNotrackArmed:
                description: |-
                  ConntrackNotrackArmed is True when iptables raw NOTRACK rules are active on
                  both source and destination nodes for the migrated pod IP (M21).
                type: boolean
              conntrackNotrackArmedAt:
                description: ConntrackNotrackArmedAt is when the NOTRACK rules were
                  installed.
                format: date-time
                type: string
              conntrackNotrackDisarmedAt:
                description: |-
                  ConntrackNotrackDisarmedAt is when the NOTRACK rules were removed.
                  Populated after MigrationComplete so the cleanup path is auditable.
                format: date-time
                type: string
              consumedAt:
                description: ConsumedAt is when the checkpoint was used for a successful
                  restore.
                format: date-time
                type: string
              destinationNetnsPath:
                description: |-
                  DestinationNetnsPath is the bind-mount path of the migration netns on the
                  destination node (e.g. /run/podmotion/netns/pm-mig-<uid>).
                type: string
              destinationNetnsReady:
                description: |-
                  DestinationNetnsReady is True when the migration netns has been created on
                  the destination node with the source pod IP as a /32 secondary address (M21).
                type: boolean
              phase:
                description: 'Phase is the checkpoint lifecycle phase: Capturing,
                  Available, Consumed, Expired, Failed.'
                enum:
                - Capturing
                - Available
                - Consumed
                - Expired
                - Failed
                type: string
              vxlanFDBUpdated:
                description: |-
                  VXLANFDBUpdated is True when the two-sided AF_BRIDGE + AF_INET FDB entries
                  have been confirmed via RTM_GETNEIGH read-back on both nodes (M21).
                type: boolean
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
