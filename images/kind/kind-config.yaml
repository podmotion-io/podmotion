# PodMotion Sprint 31 gate cluster — 1 control-plane + 1 worker (amd64/kind)
# Usage: kind create cluster --name podmotion-sprint31 --config images/kind/kind-config.yaml
# NP-AMD64-BASELINE / ADR-0145 / ADR-0146 — docs/sprints/run-sprint31-gate.sh expects a single
# worker node container named <cluster>-worker (GC-14, GC-20), so this config intentionally
# uses exactly one worker rather than the 2-worker sprint53 topology this file previously held.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: podmotion-sprint31
# ADR-MAP: sprint53 (kind Cilium revival) note retained — no shared hostPath /sys/fs/bpf mount
# here; images/kind/Dockerfile installs its own sys-fs-bpf.mount systemd unit giving each node
# container a private, per-netns bpffs. Sprint 31 gate uses the vendored Flannel CNI path
# (kind-create applies images/kind/kube-flannel-v0.25.4.yml), not Cilium, so this is inert here
# but kept correct/consistent with the Dockerfile regardless of which CNI is layered on top.
nodes:
  - role: control-plane
    image: podmotion-node:sprint31-amd64
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            feature-gates: "ContainerCheckpoint=true"
  - role: worker
    image: podmotion-node:sprint31-amd64
networking:
  # disableDefaultCNI: kind's default CNI is kindnet. `make kind-create` separately
  # applies flannel (kube-flannel v0.25.4). Without this flag BOTH kindnet and flannel
  # install on the same podSubnet (10.244.0.0/16) and conflict. ADR-0202.
  disableDefaultCNI: true
  podSubnet: "10.244.0.0/16"
  serviceSubnet: "10.96.0.0/12"
featureGates:
  GracefulNodeShutdown: true
  ContainerCheckpoint: true
