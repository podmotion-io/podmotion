# PodMotion development cluster — 1 control-plane + 2 workers
# Usage: kind create cluster --config images/kind/kind-config.yaml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: podmotion-dev
nodes:
  - role: control-plane
    image: podmotion/kind-node:dev
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            feature-gates: "ContainerCheckpoint=true"
    extraMounts:
      - hostPath: /sys/fs/bpf
        containerPath: /sys/fs/bpf
        propagation: Bidirectional
  - role: worker
    image: podmotion/kind-node:dev
    extraMounts:
      - hostPath: /sys/fs/bpf
        containerPath: /sys/fs/bpf
        propagation: Bidirectional
  - role: worker
    image: podmotion/kind-node:dev
    extraMounts:
      - hostPath: /sys/fs/bpf
        containerPath: /sys/fs/bpf
        propagation: Bidirectional
networking:
  podSubnet: "10.244.0.0/16"
  serviceSubnet: "10.96.0.0/12"
featureGates:
  GracefulNodeShutdown: true
  ContainerCheckpoint: true
