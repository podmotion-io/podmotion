# Enable NRI (Node Resource Interface) in containerd.
# Required for podmotion-nri-plugin to hook into container Stopping events.
[plugins."io.containerd.nri.v1.nri"]
  disable = false
  disable_connections = false
  plugin_registration_timeout = "5s"
  # The NRI HandleStartContainer hook runs a 45s bounded verify retry to tolerate
  # operator phase advance (OverlayHandoff -> Restoring). plugin_request_timeout MUST be >= 60s on
  # all nodes or containerd cancels the hook context before the retry can succeed.
  # Default/legacy values in the 2s-30s range are too short and will break migration.
  plugin_request_timeout = "60s"
  socket_path = "/var/run/nri/nri.sock"
  state_dir = "/var/lib/nri"
