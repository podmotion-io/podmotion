---
# podmotion-node Ansible role — multi-distro (Ubuntu + AL2023 + RHEL 9)
# Applied on top of kubernetes-sigs/image-builder CAPI base image via Packer.
# Installs CRIU, pins runc, enables NRI in containerd, configures bpffs, bakes
# agent binaries, and handles AL2023 SELinux permissive domain setup.

# ---- detect distro -----------------------------------------------------------
- name: Gather OS family facts
  setup:
    gather_subset:
      - "!all"
      - min

# ---- package installation (apt — Ubuntu) ------------------------------------
# NOTE: "criu" is NOT an installable apt package on Ubuntu 24.04 (noble) — it is
# a virtual package with no provider (verified live: `apt-cache policy criu` /
# `apt show criu` report "not a real package (virtual)", and `apt-get install
# criu` fails with "has no installation candidate"). It was dropped from the
# Debian/Ubuntu archive upstream. CRIU must be built from source on this distro.
#
# Building from source is also required to get nftables support at all: even on
# older distros where a "criu" apt package exists, Debian/Ubuntu's prebuilt criu
# binaries are commonly built WITHOUT libnftables linked in, which produces the
# runtime failure this task exists to fix:
#   "Error (criu/net.c:2653): net: Unable to restore nftables. CRIU was built
#   without libnftables support"
# CRIU's build silently omits nftables support unless libnftables-dev (pkg-config
# name libnftables) is present on the PATH at build time — there is no explicit
# --enable/--disable flag, it's autodetected. So the fix is: install
# libnftables-dev (plus the rest of CRIU's build deps) BEFORE compiling, then
# build CRIU itself from source.
- name: Install CRIU build dependencies + other node tools (Debian/Ubuntu)
  apt:
    name:
      - build-essential
      - pkg-config
      - git
      - libprotobuf-dev
      - libprotobuf-c-dev
      - protobuf-c-compiler
      - protobuf-compiler
      - python3-protobuf
      - libbsd-dev
      - libnl-3-dev
      - libnl-genl-3-dev
      - libnet1-dev
      - libcap-dev
      - uuid-dev
      - libnftables-dev
      - libgnutls28-dev
      - iproute2
      - libnetfilter-queue-dev
      - buildah
      - skopeo
      - jq
    state: present
    update_cache: true
  when: ansible_os_family == "Debian"

# "bpftool" is a virtual package on Debian/Ubuntu (pre-existing bug, not
# related to the CRIU/nftables fix above — surfaced live during this build):
# `apt install bpftool` fails with "has no installation candidate" because the
# real binary ships in the kernel-version-matched linux-tools package via
# update-alternatives, not a package literally named "bpftool".
- name: Install bpftool (Debian/Ubuntu) — kernel-version-matched linux-tools package
  apt:
    name:
      - linux-tools-common
      - "linux-tools-{{ ansible_kernel }}"
    state: present
  when: ansible_os_family == "Debian"

# CRIU has no GPG-signed release tarballs, so the trust anchor here is an exact,
# non-mutable commit SHA on the official upstream repo (not a branch, and not
# just the "v4.2" tag name, which — unlike the commit it currently points at —
# is technically re-writable by anyone with push access). Bump this SHA
# deliberately when upgrading CRIU; don't track a moving tag/branch.
# SHA below verified to be what the "v4.2" tag pointed at on the upstream repo
# at the time this task was written (github.com/checkpoint-restore/criu).
- name: Set pinned CRIU source commit
  set_fact:
    criu_src_commit: "3c7d4fa013297b431da48eff821db7f2e8b90c27" # v4.2
  when: ansible_os_family == "Debian"

- name: Clone CRIU source at pinned commit (Debian/Ubuntu)
  git:
    repo: https://github.com/checkpoint-restore/criu.git
    dest: /usr/local/src/criu
    version: "{{ criu_src_commit }}"
  when: ansible_os_family == "Debian"

- name: Verify checked-out CRIU source matches the pinned commit exactly
  command: git -C /usr/local/src/criu rev-parse HEAD
  register: criu_src_head
  changed_when: false
  when: ansible_os_family == "Debian"

- name: Fail if CRIU source commit does not match the pin (supply-chain guard)
  fail:
    msg: >-
      CRIU source at /usr/local/src/criu is at commit {{ criu_src_head.stdout }},
      expected the pinned commit {{ criu_src_commit }}. Refusing to build —
      this would ship an unverified/unpinned CRIU binary.
  when:
    - ansible_os_family == "Debian"
    - criu_src_head.stdout != criu_src_commit

- name: Build CRIU from source (Debian/Ubuntu)
  command: make -j{{ ansible_processor_vcpus | default(2) }}
  args:
    chdir: /usr/local/src/criu
  when: ansible_os_family == "Debian"

- name: Confirm the freshly-built criu binary links libnftables
  shell: ldd /usr/local/src/criu/criu/criu | grep -q libnftables
  changed_when: false
  when: ansible_os_family == "Debian"

- name: Install CRIU to /usr/sbin (Debian/Ubuntu)
  # PREFIX=/usr puts the binary at /usr/sbin/criu — the runtime path hardcoded
  # in cmd/agent/main.go, internal/agent/nmcregistrar/registrar.go, and the
  # criu-wrapper invocation in internal/agent/server/server.go. Installing to
  # the default /usr/local/sbin would leave the agent unable to find it.
  command: make PREFIX=/usr install-criu
  args:
    chdir: /usr/local/src/criu
  when: ansible_os_family == "Debian"

- name: Remove CRIU build tree (image hygiene — do not ship build artifacts)
  file:
    path: /usr/local/src/criu
    state: absent
  when: ansible_os_family == "Debian"

# ---- package installation (dnf — AL2023 / RHEL 9) ---------------------------
- name: Install CRIU and tools (AL2023 / RHEL family)
  dnf:
    name:
      - criu
      - bpftool
      - iproute-tc
      - libnetfilter_queue
      - libnetfilter_queue-devel
      - skopeo
      - buildah
      - jq
      - policycoreutils
      - policycoreutils-devel
    state: present
  when: ansible_os_family == "RedHat"

# ---- package installation (yum + EPEL — AL2) --------------------------------
- name: Enable EPEL on Amazon Linux 2
  command: amazon-linux-extras install -y epel
  when:
    - ansible_os_family == "RedHat"
    - ansible_distribution == "Amazon"
    - ansible_distribution_major_version == "2"

- name: Install CRIU and tools (AL2 via EPEL)
  yum:
    name:
      - criu
      - bpftool
      - iproute-tc
      - jq
    state: present
    enablerepo: epel
  when:
    - ansible_os_family == "RedHat"
    - ansible_distribution == "Amazon"
    - ansible_distribution_major_version == "2"

# ---- CRIU version check ------------------------------------------------------
- name: Verify CRIU is functional
  command: criu check --extra
  register: criu_check
  failed_when: criu_check.rc != 0
  # Inside Packer's chroot/qemu context kernel checks will warn — not fatal.
  ignore_errors: true

- name: Record CRIU version
  command: criu --version
  register: criu_version_out
  changed_when: false

- name: Show CRIU version
  debug:
    msg: "CRIU version: {{ criu_version_out.stdout }}"

# ---- kernel config verification ----------------------------------------------
- name: Verify kernel config — CHECKPOINT_RESTORE
  shell: grep -q "CONFIG_CHECKPOINT_RESTORE=y" /boot/config-$(uname -r)
  failed_when: false
  changed_when: false
  register: kconfig_cr

- name: Verify kernel config — MEM_SOFT_DIRTY
  shell: grep -q "CONFIG_MEM_SOFT_DIRTY=y" /boot/config-$(uname -r)
  failed_when: false
  changed_when: false
  register: kconfig_msd

- name: Verify kernel config — USERFAULTFD
  shell: grep -q "CONFIG_USERFAULTFD=y" /boot/config-$(uname -r)
  failed_when: false
  changed_when: false
  register: kconfig_ufd

- name: Verify kernel config — BPF_SYSCALL
  shell: grep -q "CONFIG_BPF_SYSCALL=y" /boot/config-$(uname -r)
  failed_when: false
  changed_when: false
  register: kconfig_bpf

- name: Verify kernel config — XDP_SOCKETS
  shell: grep -q "CONFIG_XDP_SOCKETS=y" /boot/config-$(uname -r)
  failed_when: false
  changed_when: false
  register: kconfig_xdp

- name: Warn on missing kernel configs
  debug:
    msg: "WARNING: kernel config {{ item.name }} is not set — some migration modes will be unavailable"
  when: item.result.rc != 0
  loop:
    - { name: CONFIG_CHECKPOINT_RESTORE, result: "{{ kconfig_cr }}" }
    - { name: CONFIG_MEM_SOFT_DIRTY,     result: "{{ kconfig_msd }}" }
    - { name: CONFIG_USERFAULTFD,        result: "{{ kconfig_ufd }}" }
    - { name: CONFIG_BPF_SYSCALL,        result: "{{ kconfig_bpf }}" }
    - { name: CONFIG_XDP_SOCKETS,        result: "{{ kconfig_xdp }}" }

# ---- sysctl ------------------------------------------------------------------
- name: Install PodMotion sysctl config
  copy:
    content: |
      # PodMotion node requirements
      vm.unprivileged_userfaultfd = 1
      net.core.bpf_jit_enable = 1
      net.ipv4.conf.all.rp_filter = 0
      net.ipv4.conf.default.rp_filter = 0
    dest: /etc/sysctl.d/90-podmotion.conf
    owner: root
    group: root
    mode: "0644"

# ---- containerd NRI config ---------------------------------------------------
- name: Create containerd conf.d and NRI plugin directories
  file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /etc/containerd/conf.d
    - /usr/local/lib/nri
    - /var/run/nri
    - /var/lib/nri

- name: Get containerd version
  command: containerd --version
  register: containerd_ver_out
  changed_when: false
  failed_when: false

- name: Install containerd NRI config snippet (containerd 1.7+ only)
  copy:
    src: nri.toml
    dest: /etc/containerd/conf.d/nri.toml
    owner: root
    group: root
    mode: "0644"
  when: >
    containerd_ver_out.stdout is defined and
    (containerd_ver_out.stdout | regex_search('(\d+)\.(\d+)', '\\1', '\\2') | first | int >= 1) and
    (containerd_ver_out.stdout | regex_search('\d+\.(\d+)', '\\1') | first | int >= 7)

- name: Warn if NRI not available (containerd < 1.7)
  debug:
    msg: "WARNING: containerd version < 1.7 detected — NRI plugin API unavailable. AL2 EKS nodes will use exec-based CRIU fallback."
  when: >
    containerd_ver_out.stdout is not defined or
    not (containerd_ver_out.stdout | regex_search('\d+\.(\d+)', '\\1') | first | int >= 7)

# ---- /usr/local/bin/ctr symlink ----------------------------------------------
# podmotion-agent's exec allowlist (internal/agent/netnsbroker/broker.go) hard-
# codes "/usr/local/bin/ctr". The apt containerd package on Ubuntu 24.04 only
# installs the binary at /usr/bin/ctr, so without this symlink the agent's
# allowlisted exec fails outright. Same "provision host deps on deploy"
# discipline hack/kvm-cluster.sh already applies for the KVM substrate
# (`sudo ln -sfn "$REAL_CTR" /usr/local/bin/ctr`, idempotent, resolves ctr
# wherever it actually lives) — replicated here so the golden AMI ships with
# the symlink baked in rather than relying on a post-boot fixup.
- name: Find real ctr binary path
  command: which ctr
  register: real_ctr_path
  changed_when: false
  failed_when: real_ctr_path.rc != 0 or real_ctr_path.stdout == ""

- name: Symlink /usr/local/bin/ctr to the real ctr binary
  file:
    src: "{{ real_ctr_path.stdout }}"
    dest: /usr/local/bin/ctr
    state: link
    force: true
  when: real_ctr_path.stdout != "/usr/local/bin/ctr"

- name: Verify /usr/local/bin/ctr is executable
  command: test -x /usr/local/bin/ctr
  changed_when: false

# ---- bpffs mount ---------------------------------------------------------
# NOTE: /sys/fs/bpf is on systemd's hard-coded list of reserved "API virtual
# filesystems" (same list as /proc, /sys, /sys/fs/cgroup) that systemd mounts
# internally itself during early boot (mount-setup.c) — verified live via
# `systemd-analyze verify` against a copy of this role's own unit file on
# systemd 255 (matches Ubuntu 24.04's shipped version): systemd refuses to
# even LOAD a user-defined .mount unit for these paths, failing closed with
# "Cannot create mount unit for API file system /sys/fs/bpf. Refusing." /
# "Unit sys-fs-bpf.mount has a bad unit file setting." This is not something
# to retry or narrow — bpffs is already mounted automatically by systemd on
# every systemd >=237 host, so no custom unit is needed or possible. The
# previous custom sys-fs-bpf.mount unit + enable task were removed; this task
# only verifies systemd already provides the mount as expected.
- name: Verify bpffs is mounted at /sys/fs/bpf (provided natively by systemd)
  command: findmnt -n -t bpf /sys/fs/bpf
  register: bpffs_mount_check
  changed_when: false
  failed_when: bpffs_mount_check.rc != 0

# ---- SELinux module (AL2023 / RHEL 9 only) -----------------------------------
- name: Copy PodMotion SELinux type enforcement file
  copy:
    src: podmotion.te
    dest: /tmp/podmotion.te
    owner: root
    group: root
    mode: "0644"
  when:
    - ansible_os_family == "RedHat"
    - ansible_selinux.status == "enabled"
  # podmotion.te source: deploy/selinux/podmotion.te
  # If file is absent, the role continues (SELinux module is a best-effort step).
  failed_when: false
  ignore_errors: true
  register: selinux_te_copy

- name: Compile and install SELinux module
  shell: |
    checkmodule -M -m -o /tmp/podmotion.mod /tmp/podmotion.te && \
    semodule_package -o /tmp/podmotion.pp -m /tmp/podmotion.mod && \
    semodule -i /tmp/podmotion.pp
  when:
    - ansible_os_family == "RedHat"
    - selinux_te_copy is defined
    - selinux_te_copy is not failed
    - selinux_te_copy.changed | default(false)
  failed_when: false
  register: selinux_module

- name: Warn if SELinux module install failed
  debug:
    msg: "WARNING: SELinux module not installed — podmotion_t domain will be unconfined. Enterprise deployments must resolve deploy/selinux/podmotion.te before production use."
  when: >
    ansible_os_family == "RedHat" and
    (selinux_module is not defined or (selinux_module.rc | default(1)) != 0)

# ---- BPF objects -------------------------------------------------------------
- name: Create BPF object directory
  file:
    path: /usr/lib/podmotion/bpf
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install zero_window BPF objects
  copy:
    src: "{{ item.src }}"
    dest: "/usr/lib/podmotion/bpf/{{ item.dest }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - { src: zero_window_bpfel.o, dest: zero_window_bpfel.o }
    - { src: zero_window_bpfeb.o, dest: zero_window_bpfeb.o }

# ---- agent binaries ----------------------------------------------------------
- name: Install podmotion-agent binary
  copy:
    src: podmotion-agent
    dest: /usr/local/bin/podmotion-agent
    owner: root
    group: root
    mode: "0755"

- name: Install podmotion-nri-plugin symlink
  file:
    src: /usr/local/bin/podmotion-agent
    dest: /usr/local/lib/nri/podmotion-nri
    state: link
    force: true

- name: Install podmotion-preflight script
  copy:
    src: podmotion-preflight-amazon.sh
    dest: /usr/local/bin/podmotion-preflight
    owner: root
    group: root
    mode: "0755"

# ---- podmotion-agent systemd service ----------------------------------------
- name: Install podmotion-agent systemd service unit
  copy:
    content: |
      [Unit]
      Description=PodMotion Node Agent
      Documentation=https://podmotion.io/docs/node-agent
      After=network.target containerd.service
      Requires=containerd.service

      [Service]
      ExecStart=/usr/local/bin/podmotion-agent \
        --node-name=${NODE_NAME} \
        --grpc-port=9090 \
        --metrics-port=9091 \
        --preflight-json=/var/log/podmotion-preflight.json
      Restart=always
      RestartSec=10
      EnvironmentFile=-/etc/podmotion/agent.env
      StandardOutput=journal
      StandardError=journal
      SyslogIdentifier=podmotion-agent

      [Install]
      WantedBy=multi-user.target
    dest: /etc/systemd/system/podmotion-agent.service
    owner: root
    group: root
    mode: "0644"

- name: Create /etc/podmotion directory
  file:
    path: /etc/podmotion
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Create agent env file placeholder
  copy:
    content: "# NODE_NAME resolved at first boot from IMDS cloud-init\nNODE_NAME=\n"
    dest: /etc/podmotion/agent.env
    owner: root
    group: root
    mode: "0640"
    force: false  # don't overwrite if already populated

- name: Enable podmotion-agent service (start deferred to first boot)
  systemd:
    name: podmotion-agent
    enabled: true
    daemon_reload: true
