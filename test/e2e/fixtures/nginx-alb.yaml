---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-alb
  namespace: default
  labels:
    app: nginx-alb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-alb
  template:
    metadata:
      labels:
        app: nginx-alb
      annotations:
        alb.ingress.kubernetes.io/scheme: internet-facing
        alb.ingress.kubernetes.io/target-type: ip
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-alb
  namespace: default
spec:
  selector:
    app: nginx-alb
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nginx-alb
  namespace: default
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nginx-alb
                port:
                  number: 80
