# Redis source pod for live-migration Strict-mode evidence gathering (Sprint 44).
# Pinned to pm-w1; migrated to pm-w2 via a PodMigration CR.
#
# Redis dump/AOF dir is backed by an RWX PVC on the standing shared-NFS
# StorageClass (nfs-shared), NOT emptyDir — same re-attach model as the
# postgres fixture (Tier0: shared storage visible from both nodes, no data
# movement, destination pod re-attaches the same mount post-restore).
apiVersion: v1
kind: Namespace
metadata:
  name: pm-redis-test
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  namespace: pm-redis-test
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-shared
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: pm-redis-test
data:
  redis.conf: |
    dir /data
    appendonly yes
    appendfsync everysec
    save 60 1
---
apiVersion: v1
kind: Pod
metadata:
  name: redis-src
  namespace: pm-redis-test
  labels:
    app: redis-live
spec:
  nodeName: pm-w1
  containers:
  - name: redis
    image: redis:7-alpine
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
    - containerPort: 6379
    volumeMounts:
    - name: data
      mountPath: /data
    - name: config
      mountPath: /usr/local/etc/redis
    resources:
      requests:
        memory: "64Mi"
        cpu: "50m"
      limits:
        memory: "128Mi"
        cpu: "300m"
    readinessProbe:
      exec:
        command: ["redis-cli", "ping"]
      initialDelaySeconds: 3
      periodSeconds: 2
  volumes:
  - name: data
    persistentVolumeClaim:
      claimName: redis-data
  - name: config
    configMap:
      name: redis-config
---
apiVersion: v1
kind: Service
metadata:
  name: redis-live-svc
  namespace: pm-redis-test
spec:
  selector:
    app: redis-live
  ports:
  - port: 6379
    targetPort: 6379
