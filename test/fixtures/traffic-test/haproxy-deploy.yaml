apiVersion: v1
kind: ServiceAccount
metadata:
  name: haproxy-tcp
  namespace: pm-live-test
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: haproxy-tcp
  namespace: pm-live-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: haproxy-tcp
  template:
    metadata:
      labels:
        app: haproxy-tcp
    spec:
      serviceAccountName: haproxy-tcp
      # Pin to pm-cp1 so it doesn't migrate with the workload
      nodeName: pm-cp1
      containers:
      - name: haproxy
        image: haproxy:2.9-alpine
        ports:
        - containerPort: 8080
          name: proxy
        - containerPort: 9090
          name: stats
        volumeMounts:
        - name: cfg
          mountPath: /usr/local/etc/haproxy/haproxy.cfg
          subPath: haproxy.cfg
        - name: run
          mountPath: /var/run/haproxy
        resources:
          requests:
            memory: "32Mi"
            cpu: "50m"
          limits:
            memory: "64Mi"
            cpu: "200m"
      volumes:
      - name: cfg
        configMap:
          name: haproxy-tcp-cfg
      - name: run
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: haproxy-tcp-svc
  namespace: pm-live-test
spec:
  selector:
    app: haproxy-tcp
  ports:
  - name: proxy
    port: 8080
    targetPort: 8080
  - name: stats
    port: 9090
    targetPort: 9090
