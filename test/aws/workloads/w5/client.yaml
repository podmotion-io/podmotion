---
apiVersion: v1
kind: Pod
metadata:
  name: w5-client
  namespace: podmotion-gate
  labels:
    app: w5-client
    podmotion.io/workload-type: w5
spec:
  restartPolicy: Never
  nodeSelector:
    podmotion.io/role: client
  tolerations:
    - key: podmotion.io/role
      operator: Equal
      value: client
      effect: NoSchedule
  containers:
    - name: grpc-client
      # image: <registry>/grpc-streaming-client:latest  # human-readable tag
      image: FILL_IN_DIGEST  # pin to sha256 digest before gate run
      env:
        - name: TARGET_SVC
          value: w5-svc.podmotion-gate.svc.cluster.local:8080
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi
