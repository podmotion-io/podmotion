---
# W7 client pod — multi-container-envoy
# Maintains active HTTP connections to w7-svc:8080 (routed through Envoy on port 9090).
# ADR-0112 §4: client pods land on client nodes; must not share a node with the workload.
# ADR-0112 §1: image pinned by digest; tag is a human-readable comment only.
apiVersion: v1
kind: Pod
metadata:
  name: w7-client
  namespace: podmotion-gate
  labels:
    app: w7-client
    podmotion.io/workload-type: w7
spec:
  # ADR-0112 §4: client pods must land on client nodes, not worker nodes
  nodeSelector:
    podmotion.io/role: client
  tolerations:
    - key: podmotion.io/role
      operator: Equal
      value: client
      effect: NoSchedule
  restartPolicy: Always
  containers:
    - name: client
      # ADR-0112 §1: image pinned by digest; tag is a human-readable comment only
      image: FILL_IN_DIGEST  # w7-client:latest — maintains active HTTP connections to TARGET_SVC
      env:
        - name: TARGET_SVC
          value: w7-svc.podmotion-gate.svc.cluster.local:8080
      resources:
        # ADR-0112 §3: client pods use 50m CPU / 64Mi memory uniformly
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi
