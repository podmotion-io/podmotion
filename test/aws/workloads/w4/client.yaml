---
apiVersion: v1
kind: Pod
metadata:
  name: w4-client
  namespace: podmotion-gate
  labels:
    app: w4-client
    podmotion.io/workload-type: w4
spec:
  nodeSelector:
    podmotion.io/role: client
  tolerations:
    - key: podmotion.io/role
      operator: Equal
      value: client
      effect: NoSchedule
  restartPolicy: Never
  containers:
    - name: client
      # w4-client binary — digest must be pinned before gate run; replace FILL_IN_DIGEST
      image: podmotion-gate/w4-client@sha256:FILL_IN_DIGEST
      env:
        - name: TARGET_SVC
          value: w4-svc.podmotion-gate.svc.cluster.local:4222
        - name: NATS_URL
          value: nats://w4-svc.podmotion-gate.svc.cluster.local:4222
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi
