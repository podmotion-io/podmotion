---
apiVersion: v1
kind: Namespace
metadata:
  name: podmotion-gate
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: w4-workload
  namespace: podmotion-gate
  labels:
    app: w4
    podmotion.io/workload-type: w4
spec:
  replicas: 1
  selector:
    matchLabels:
      app: w4
  template:
    metadata:
      labels:
        app: w4
        podmotion.io/workload-type: w4
    spec:
      nodeSelector:
        podmotion.io/role: worker
      tolerations:
        - key: podmotion.io/role
          operator: Equal
          value: worker
          effect: NoSchedule
      containers:
        - name: nats
          # nats:2.10 — digest must be pinned before gate run; replace FILL_IN_DIGEST
          image: nats@sha256:FILL_IN_DIGEST
          ports:
            - name: client
              containerPort: 4222
              protocol: TCP
            - name: cluster
              containerPort: 6222
              protocol: TCP
            - name: monitor
              containerPort: 8222
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          readinessProbe:
            tcpSocket:
              port: 4222
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: w4-svc
  namespace: podmotion-gate
  labels:
    app: w4
    podmotion.io/workload-type: w4
spec:
  type: ClusterIP
  selector:
    app: w4
  ports:
    - name: client
      port: 4222
      targetPort: 4222
      protocol: TCP
    - name: monitor
      port: 8222
      targetPort: 8222
      protocol: TCP
