---
apiVersion: v1
kind: Pod
metadata:
  name: w6-client
  namespace: podmotion-gate
  labels:
    app: w6-client
    podmotion.io/workload-type: w6
spec:
  restartPolicy: Always
  nodeSelector:
    podmotion.io/role: client
  tolerations:
    - key: podmotion.io/role
      operator: Equal
      value: client
      effect: NoSchedule
  containers:
    - name: ws-client
      # FILL_IN_DIGEST — WebSocket client binary that maintains long-lived connection
      # and counts received frames; exposes /metrics with frame_counter gauge.
      # Replace with: image: <registry>/ws-client@sha256:<digest>
      image: FILL_IN_DIGEST
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi
      env:
        - name: TARGET_SVC
          value: "w6-svc.podmotion-gate.svc.cluster.local:8080"
