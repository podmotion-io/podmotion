---
apiVersion: v1
kind: Pod
metadata:
  name: w1-client
  namespace: podmotion-gate
  labels:
    app: w1-client
    podmotion.io/workload-type: w1
spec:
  restartPolicy: Never
  nodeSelector:
    podmotion.io/role: client
  tolerations:
    - key: podmotion.io/role
      operator: Equal
      value: client
      effect: NoSchedule
  containers:
    - name: client
      # podmotion-gate-client — pin digest before run
      image: podmotion-gate-client@sha256:FILL_IN_DIGEST
      env:
        - name: TARGET_SVC
          value: w1-svc.podmotion-gate.svc.cluster.local:8080
        - name: WORKLOAD_TYPE
          value: w1
        - name: REQUEST_PATH
          value: /healthz
        - name: REQUEST_INTERVAL_MS
          value: "100"
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi
